<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    * { font-family: 'Tajawal', system-ui, -apple-system, sans-serif; }

<body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white pb-24">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    const IconFlame = () => <svg className="w-4 h-4 text-amber-500 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>;
    const IconDrumstick = () => <svg className="w-4 h-4 text-rose-500 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-9-3-3-9 9m0 0l-3 3a2.828 2.828 0 11-4-4l3-3m4 4L9 11"/></svg>;
    const IconWheat = () => <svg className="w-4 h-4 text-amber-600 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v18m0-18l-4 4m4-4l4 4m-4 5l-4 4m4-4l4 4m-4 5l-4 4m4-4l4 4"/></svg>;
    const IconSalad = () => <svg className="w-4 h-4 text-emerald-600 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>;
    const IconOil = () => <svg className="w-4 h-4 text-amber-700 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L5.59 15.12a2 2 0 00-1.282.26L3 16v3a2 2 0 002 2h14a2 2 0 002-2v-3.572l-1.572-.999z"/></svg>;
    const IconPlus = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 6v12m6-6H6"/></svg>;
    const IconMinus = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M18 12H6"/></svg>;
    const IconX = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>;
    const IconFilter = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>;

    const INITIAL_INGREDIENTS = [
      { id: 'ing-1', name: 'صدر دجاج طازج', unit: 'جرام', baseQty: 100, protein: 31, carbs: 0, fat: 3.6, fiber: 0, calories: 165, icon: '🍗' },
      { id: 'ing-2', name: 'أرز بسمتي أبيض', unit: 'جرام', baseQty: 100, protein: 2.7, carbs: 28, fat: 0.3, fiber: 0.4, calories: 130, icon: '🍚' },
      { id: 'ing-3', name: 'زيت زيتون بكر', unit: 'ملعقة', baseQty: 10, protein: 0, carbs: 0, fat: 10, fiber: 0, calories: 88, icon: '🫒' },
      { id: 'ing-4', name: 'بيض كامل', unit: 'حبة', baseQty: 1, protein: 6, carbs: 0.5, fat: 5, fiber: 0, calories: 72, icon: '🥚' },
      { id: 'ing-6', name: 'بطاطا حلوة مسلوقة', unit: 'جرام', baseQty: 100, protein: 1.6, carbs: 20, fat: 0.1, fiber: 3, calories: 86, icon: '🍠' },
      { id: 'ing-7', name: 'سلمون طازج', unit: 'جرام', baseQty: 100, protein: 20, carbs: 0, fat: 13, fiber: 0, calories: 206, icon: '🐟' },
      { id: 'ing-8', name: 'حليب بروتين بلدنا', unit: 'علبة', baseQty: 1, protein: 30, carbs: 16, fat: 2.2, fiber: 0, calories: 205, icon: '🥛' },
      { id: 'ing-9', name: 'زبادي يوناني سادة', unit: 'علبة', baseQty: 1, protein: 18, carbs: 6, fat: 1.5, fiber: 0, calories: 120, icon: '🥣' },
      { id: 'ing-11', name: 'شوفان كامل الحبة', unit: 'جرام', baseQty: 100, protein: 13, carbs: 67, fat: 7, fiber: 10, calories: 389, icon: '🌾' },
      { id: 'ing-12', name: 'سلطة خضراء مشكلة', unit: 'جرام', baseQty: 100, protein: 1, carbs: 4, fat: 0.2, fiber: 2, calories: 20, icon: '🥗' },
      { id: 'ing-14', name: 'خبز توست أسمر', unit: 'شريحة', baseQty: 1, protein: 4, carbs: 12, fat: 1, fiber: 2, calories: 70, icon: '🍞' }
    ];

    // الأطباق لم تعد تحتوي على تصنيف وجبة أو مجموعة. فقط اسم ومقادير.
    const INITIAL_DISHES = [
      {
        id: 'dish-1', name: 'دجاج مع أرز بسمتي', icon: '🍲',
        items: [{ ingredientId: 'ing-1', qtyMultiplier: 1.5 }, { ingredientId: 'ing-2', qtyMultiplier: 1.5 }, { ingredientId: 'ing-3', qtyMultiplier: 0.5 }]
      },
      {
        id: 'dish-2', name: 'سندويش بيض بالتوست الأسمر', icon: '🥪',
        items: [{ ingredientId: 'ing-4', qtyMultiplier: 2 }, { ingredientId: 'ing-14', qtyMultiplier: 2 }]
      },
      {
        id: 'dish-3', name: 'سلمون مع البطاطا الحلوة', icon: '🍱',
        items: [{ ingredientId: 'ing-7', qtyMultiplier: 1.5 }, { ingredientId: 'ing-6', qtyMultiplier: 1.5 }, { ingredientId: 'ing-12', qtyMultiplier: 1 }]
      },
      {
        id: 'dish-4', name: 'شوفان بالزبادي اليوناني', icon: '🥣',
        items: [{ ingredientId: 'ing-11', qtyMultiplier: 0.5 }, { ingredientId: 'ing-9', qtyMultiplier: 1 }]
      }
    ];

    const MEAL_TYPES = ['فطور', 'غداء', 'عشاء', 'سناك'];
    const MAX_SCALE_PERCENT = 140; // لإتاحة مساحة للفائض في أشرطة التوقع

    // مكون شريط السحب التفاعلي السلس (يدعم الـ RTL)
    const DraggableBar = ({ values, onChange, colors, labels }) => {
      const containerRef = useRef(null);

      // حساب التراكميات لمعرفة موقع المقابض
      const cumuls = [];
      let sum = 0;
      for (let i = 0; i < values.length - 1; i++) {
        sum += values[i];
        cumuls.push(sum);
      }

      const handlePointerMove = (e, idx) => {
        if (!containerRef.current) return;
        const rect = containerRef.current.getBoundingClientRect();
        // الحسبة للغة العربية RTL (من اليمين لليسار)
        let percent = ((rect.right - e.clientX) / rect.width) * 100;
        
        // قيود السحب لعدم تداخل المقابض (الحد الأدنى 5% لكل قسم)
        const min = idx === 0 ? 5 : cumuls[idx - 1] + 5;
        const max = idx === cumuls.length - 1 ? 95 : cumuls[idx + 1] - 5;
        percent = Math.max(min, Math.min(max, Math.round(percent)));
        
        const newCumuls = [...cumuls];
        newCumuls[idx] = percent;
        
        const newValues = [];
        newValues[0] = newCumuls[0];
        for (let i = 1; i < newCumuls.length; i++) {
          newValues[i] = newCumuls[i] - newCumuls[i-1];
        }
        newValues[values.length - 1] = 100 - newCumuls[newCumuls.length - 1];
        
        onChange(newValues);
      };

      return (
        <div className="relative h-8 rounded-xl flex touch-none border border-slate-200 overflow-visible bg-slate-100" ref={containerRef}>
          {values.map((v, i) => (
            <div key={i} style={{ width: `${v}%` }} className={`h-full ${colors[i]} flex flex-col items-center justify-center overflow-hidden transition-colors`}>
              {v > 12 && <span className="text-[10px] text-white font-black drop-shadow-md leading-none">{labels[i]}</span>}
              {v > 12 && <span className="text-[9px] text-white/90 font-bold leading-none mt-0.5">{v}%</span>}
            </div>
          ))}
          
          {cumuls.map((c, i) => (
            <div 
              key={i}
              className="absolute top-1/2 -translate-y-1/2 w-7 h-10 bg-white border-2 border-slate-300 rounded-full cursor-ew-resize shadow-lg flex items-center justify-center z-10 active:scale-110 active:border-emerald-500 transition-transform touch-none"
              style={{ right: `calc(${c}% - 14px)` }}
              onPointerDown={(e) => {
                e.target.setPointerCapture(e.pointerId);
                e.target.onpointermove = (ev) => handlePointerMove(ev, i);
              }}
              onPointerUp={(e) => {
                e.target.releasePointerCapture(e.pointerId);
                e.target.onpointermove = null;
              }}
              onPointerCancel={(e) => {
                e.target.releasePointerCapture(e.pointerId);
                e.target.onpointermove = null;
              }}
            >
              <div className="flex gap-0.5">
                <div className="w-[2px] h-4 bg-slate-400 rounded-full"></div>
                <div className="w-[2px] h-4 bg-slate-400 rounded-full"></div>
              </div>
            </div>
          ))}
        </div>
      );
    };

    function App() {
      // Navigation
      const [activeTab, setActiveTab] = useState('meals'); // meals, ingredients, recipes, vitals
      
      // Target Goals & Splitting
      const [targetCalories, setTargetCalories] = useState(1500);
      const [showPlanSettings, setShowPlanSettings] = useState(false); // Toggle for macro plan

      // Master Bar: Meals Distribution [Breakfast, Lunch, Dinner, Snack]
      const [mealRatios, setMealRatios] = useState([25, 35, 25, 15]);

      // Sub Bars: Macro Distribution per meal [Protein, Carbs, Fat, Fiber]
      const [macroRatios, setMacroRatios] = useState({
        'فطور': [35, 40, 15, 10],
        'غداء': [40, 35, 15, 10],
        'عشاء': [45, 25, 20, 10],
        'سناك': [50, 30, 10, 10]
      });

      // Data Arrays
      const [ingredients, setIngredients] = useState(INITIAL_INGREDIENTS);
      const [dishes, setDishes] = useState(INITIAL_DISHES);

      // Logged Meals Data Structure
      // Record format: { 'فطور': { 'dish-1': 2 }, 'غداء': { 'dish-2': 1 } ... }
      const [loggedMeals, setLoggedMeals] = useState({
        'فطور': {}, 'غداء': {}, 'عشاء': {}, 'سناك': {}
      });
      const [activeMealTab, setActiveMealTab] = useState('غداء');

      // Modals & Forms
      const [showIngModal, setShowIngModal] = useState(false);
      const [editingIngId, setEditingIngId] = useState(null);
      const [ingForm, setIngForm] = useState({ name: '', unit: 'جرام', baseQty: 100, protein: 0, carbs: 0, fat: 0, fiber: 0, icon: '🥦' });

      const [showDishModal, setShowDishModal] = useState(false);
      const [editingDishId, setEditingDishId] = useState(null);
      const [dishForm, setDishForm] = useState({ name: '', icon: '🍲', items: [] });

      const csvInputRef = useRef(null);

      // Multi-Nutrient Open Filters
      const [filters, setFilters] = useState({ calories: 'الكل', protein: 'الكل', carbs: 'الكل', fat: 'الكل', fiber: 'الكل' });

      // Calculate single dish macros
      const getDishTotals = (items) => {
        let t = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
        items.forEach(it => {
          const ing = ingredients.find(i => i.id === it.ingredientId);
          if (ing) {
            const m = it.qtyMultiplier || 1;
            t.calories += Math.round(ing.calories * m);
            t.protein += (ing.protein * m);
            t.carbs += (ing.carbs * m);
            t.fat += (ing.fat * m);
            t.fiber += (ing.fiber * m);
          }
        });
        return {
          calories: t.calories,
          protein: Math.round(t.protein * 10) / 10,
          carbs: Math.round(t.carbs * 10) / 10,
          fat: Math.round(t.fat * 10) / 10,
          fiber: Math.round(t.fiber * 10) / 10
        };
      };

      // Calculate total macros logged for the entire day
      const getDailyLoggedTotals = () => {
        let t = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
        MEAL_TYPES.forEach(meal => {
          const mealLog = loggedMeals[meal] || {};
          Object.entries(mealLog).forEach(([dishId, qty]) => {
            const dish = dishes.find(d => d.id === dishId);
            if (dish && qty > 0) {
              const dt = getDishTotals(dish.items);
              t.calories += dt.calories * qty;
              t.protein += dt.protein * qty;
              t.carbs += dt.carbs * qty;
              t.fat += dt.fat * qty;
              t.fiber += dt.fiber * qty;
            }
          });
        });
        return t;
      };

      const dailyTotals = getDailyLoggedTotals();

      // Get target grams for the whole day based on total 1500 and average macro splits
      // For precision, we calculate each meal's target and sum them up.
      const getDailyTargets = () => {
        let t = { calories: targetCalories, protein: 0, carbs: 0, fat: 0, fiber: 0 };
        MEAL_TYPES.forEach((meal, idx) => {
          const mealCals = (targetCalories * mealRatios[idx]) / 100;
          const mRatios = macroRatios[meal];
          t.protein += (mealCals * (mRatios[0] / 100)) / 4;
          t.carbs += (mealCals * (mRatios[1] / 100)) / 4;
          t.fat += (mealCals * (mRatios[2] / 100)) / 9;
          t.fiber += (mealCals * (mRatios[3] / 100)) / 4; // Approx 4 cals per g of fiber
        });
        return {
          calories: t.calories,
          protein: Math.round(t.protein),
          carbs: Math.round(t.carbs),
          fat: Math.round(t.fat),
          fiber: Math.round(t.fiber)
        };
      };
      const dailyTargets = getDailyTargets();

      // Filtering Dishes logic
      const filteredDishes = useMemo(() => {
        return dishes.filter(dish => {
          const dt = getDishTotals(dish.items);
          
          const check = (val, low, high, filterType) => {
            if (filterType === 'الكل') return true;
            if (filterType === 'منخفض') return val <= low;
            if (filterType === 'متوسط') return val > low && val < high;
            if (filterType === 'عالي') return val >= high;
            return false;
          };

          const calOk = check(dt.calories, 200, 450, filters.calories);
          const proOk = check(dt.protein, 15, 35, filters.protein);
          const carbOk = check(dt.carbs, 15, 40, filters.carbs);
          const fatOk = check(dt.fat, 5, 15, filters.fat);
          const fibOk = check(dt.fiber, 2, 6, filters.fiber);

          return calOk && proOk && carbOk && fatOk && fibOk;
        });
      }, [dishes, ingredients, filters]);

      const handleUpdateLog = (dishId, delta) => {
        setLoggedMeals(prev => {
          const mealLog = { ...(prev[activeMealTab] || {}) };
          const current = mealLog[dishId] || 0;
          const next = Math.max(0, current + delta);
          if (next === 0) delete mealLog[dishId];
          else mealLog[dishId] = next;
          return { ...prev, [activeMealTab]: mealLog };
        });
      };

      const handleSaveDish = (e) => {
        e.preventDefault();
        if (!dishForm.name || dishForm.items.length === 0) return;
        if (editingDishId) {
          setDishes(prev => prev.map(d => d.id === editingDishId ? { ...d, name: dishForm.name, icon: dishForm.icon, items: dishForm.items } : d));
        } else {
          setDishes(prev => [...prev, { id: 'dish-' + Date.now(), name: dishForm.name, icon: dishForm.icon || '🍲', items: dishForm.items }]);
        }
        setShowDishModal(false);
      };

      const toggleIngInDish = (ingId) => {
        setDishForm(prev => {
          const exists = prev.items.find(i => i.ingredientId === ingId);
          if (exists) return { ...prev, items: prev.items.filter(i => i.ingredientId !== ingId) };
          return { ...prev, items: [...prev.items, { ingredientId: ingId, qtyMultiplier: 1 }] };
        });
      };

      const exportCSV = () => {
        let csv = "\uFEFF# SECTION: INGREDIENTS\nid,name,unit,baseQty,protein,carbs,fat,fiber,calories,icon\n";
        ingredients.forEach(i => csv += `${i.id},"${i.name}",${i.unit},${i.baseQty},${i.protein},${i.carbs},${i.fat},${i.fiber},${i.calories},${i.icon}\n`);
        csv += "\n# SECTION: DISHES\ndishId,dishName,icon,ingredientId,qtyMultiplier\n";
        dishes.forEach(d => {
          d.items.forEach(it => csv += `${d.id},"${d.name}",${d.icon},${it.ingredientId},${it.qtyMultiplier}\n`);
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `nutrition_data_${Date.now()}.csv`;
        link.click();
      };

      return (
        <div className="max-w-md mx-auto">
          
          {/* TOP HEADER - GLOBAL PROGRESS */}
          <div className="bg-white p-4 rounded-b-3xl shadow-sm border-b border-slate-200 sticky top-0 z-30">
            <div className="flex items-center justify-between mb-3">
              <h1 className="font-black text-slate-900 text-lg">يومياتي التغذوية</h1>
              <div className="flex items-center gap-1.5 bg-slate-100 px-2 py-1 rounded-xl">
                <span className="text-[10px] font-bold text-slate-500">الهدف:</span>
                <input 
                  type="number" 
                  value={targetCalories} 
                  onChange={e => setTargetCalories(Number(e.target.value) || 1500)}
                  className="w-14 bg-white text-center font-black text-emerald-600 rounded text-xs border border-slate-200"
                />
              </div>
            </div>
            
            <div className="grid grid-cols-4 gap-1.5 text-center">
              <div className="bg-amber-50 p-1.5 rounded-xl border border-amber-200/50">
                <span className="text-[9px] font-bold text-amber-800 block">سعرات</span>
                <span className="text-xs font-black block">{dailyTotals.calories}</span>
                <span className="text-[8px] text-slate-400">من {dailyTargets.calories}</span>
              </div>
              <div className="bg-rose-50 p-1.5 rounded-xl border border-rose-200/50">
                <span className="text-[9px] font-bold text-rose-800 block">بروتين</span>
                <span className="text-xs font-black block">{Math.round(dailyTotals.protein)}g</span>
                <span className="text-[8px] text-slate-400">من {dailyTargets.protein}g</span>
              </div>
              <div className="bg-amber-50 p-1.5 rounded-xl border border-amber-200/50">
                <span className="text-[9px] font-bold text-amber-900 block">كارب</span>
                <span className="text-xs font-black block">{Math.round(dailyTotals.carbs)}g</span>
                <span className="text-[8px] text-slate-400">من {dailyTargets.carbs}g</span>
              </div>
              <div className="bg-emerald-50 p-1.5 rounded-xl border border-emerald-200/50">
                <span className="text-[9px] font-bold text-emerald-800 block">ألياف</span>
                <span className="text-xs font-black block">{Math.round(dailyTotals.fiber)}g</span>
                <span className="text-[8px] text-slate-400">من {dailyTargets.fiber}g</span>
              </div>
            </div>
          </div>

          <div className="p-3 space-y-4">
            
            {/* TAB 1: MEALS & PLAN */}
            {activeTab === 'meals' && (
              <div className="space-y-4 animate-in fade-in duration-200">
                
                {/* INTERACTIVE PLAN BARS SETTINGS */}
                <div className="bg-white rounded-3xl p-4 shadow-sm border border-slate-200">
                  <div className="flex items-center justify-between mb-3">
                    <h2 className="font-black text-sm text-slate-800">مخطط السعرات والماكروز</h2>
                    <button 
                      onClick={() => setShowPlanSettings(!showPlanSettings)}
                      className="text-[10px] bg-slate-100 px-3 py-1.5 rounded-xl font-bold hover:bg-slate-200"
                    >
                      {showPlanSettings ? 'إخفاء الأشرطة ⬆️' : 'تعديل الأشرطة ⚙️'}
                    </button>
                  </div>

                  {showPlanSettings && (
                    <div className="space-y-5 pt-2 border-t border-slate-100">
                      {/* Main Meals Split Bar */}
                      <div>
                        <div className="flex justify-between text-[10px] font-bold text-slate-600 mb-1.5">
                          <span>1. توزيع السعرات على الوجبات:</span>
                        </div>
                        <DraggableBar 
                          values={mealRatios} 
                          onChange={setMealRatios} 
                          colors={['bg-amber-400', 'bg-emerald-400', 'bg-indigo-400', 'bg-rose-400']}
                          labels={MEAL_TYPES}
                        />
                      </div>

                      {/* Macro Split Sub-Bars for Each Meal */}
                      <div className="space-y-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                        <span className="text-[10px] font-bold text-slate-600 block">2. توزيع الماكروز داخل كل وجبة (بروتين/كارب/دهون/ألياف):</span>
                        {MEAL_TYPES.map((meal, idx) => (
                          <div key={meal}>
                            <div className="flex justify-between text-[10px] font-bold mb-1">
                              <span className="text-slate-800">{meal} ({mealRatios[idx]}%)</span>
                            </div>
                            <DraggableBar 
                              values={macroRatios[meal]}
                              onChange={(newVals) => setMacroRatios(prev => ({...prev, [meal]: newVals}))}
                              colors={['bg-rose-400', 'bg-amber-500', 'bg-amber-700', 'bg-emerald-500']}
                              labels={['بروتين', 'كارب', 'دهون', 'ألياف']}
                            />
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* FILTERS */}
                <div className="bg-white rounded-2xl p-3 shadow-sm border border-slate-200 space-y-2">
                  <div className="flex justify-between items-center border-b border-slate-100 pb-1.5">
                    <span className="text-xs font-black flex items-center gap-1"><IconFilter /> فلاتر المغذيات المفتوحة:</span>
                    <button onClick={() => setFilters({ calories:'الكل', protein:'الكل', carbs:'الكل', fat:'الكل', fiber:'الكل' })} className="text-[10px] text-rose-500 font-bold">إعادة ضبط</button>
                  </div>
                  <div className="space-y-1.5 text-[10px]">
                    {[
                      { key: 'calories', label: '🔥 السعرات' },
                      { key: 'protein', label: '🍗 البروتين' },
                      { key: 'carbs', label: '🌾 الكارب' },
                      { key: 'fat', label: '🫒 الدهون' },
                      { key: 'fiber', label: '🥗 الألياف' }
                    ].map(nut => (
                      <div key={nut.key} className="flex items-center justify-between bg-slate-50 p-1 rounded-xl">
                        <span className="font-bold text-slate-700 w-16">{nut.label}</span>
                        <div className="flex gap-1">
                          {['الكل', 'منخفض', 'متوسط', 'عالي'].map(lvl => (
                            <button
                              key={lvl}
                              onClick={() => setFilters(prev => ({ ...prev, [nut.key]: lvl }))}
                              className={`px-2 py-0.5 rounded-lg font-bold transition-all ${filters[nut.key] === lvl ? 'bg-slate-900 text-white' : 'bg-white text-slate-500 border border-slate-200'}`}
                            >
                              {lvl}
                            </button>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* MEAL TABS */}
                <div className="grid grid-cols-4 gap-1 bg-white p-1.5 rounded-2xl border border-slate-200">
                  {MEAL_TYPES.map(m => (
                    <button
                      key={m}
                      onClick={() => setActiveMealTab(m)}
                      className={`py-2 text-xs font-bold rounded-xl transition-all ${activeMealTab === m ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-500'}`}
                    >
                      {m}
                    </button>
                  ))}
                </div>

                {/* DISH CARDS WITH FORECAST BARS */}
                <div className="space-y-3">
                  {filteredDishes.length === 0 ? (
                    <div className="text-center p-8 bg-white rounded-3xl border border-slate-200 text-slate-400 font-bold text-xs">لا توجد أطباق تطابق الفلاتر</div>
                  ) : (
                    filteredDishes.map(dish => {
                      const dt = getDishTotals(dish.items);
                      const currentQty = loggedMeals[activeMealTab][dish.id] || 0;
                      
                      // Progress Math for Card vs Daily Target
                      const getPct = (currentVal, targetVal) => Math.min(100, (currentVal / targetVal) * 100);
                      
                      const calPct = getPct(dailyTotals.calories, dailyTargets.calories);
                      const proPct = getPct(dailyTotals.protein, dailyTargets.protein);
                      const carbPct = getPct(dailyTotals.carbs, dailyTargets.carbs);
                      const fatPct = getPct(dailyTotals.fat, dailyTargets.fat);
                      const fibPct = getPct(dailyTotals.fiber, dailyTargets.fiber);

                      const calFore = getPct(dailyTotals.calories + dt.calories, dailyTargets.calories);
                      const proFore = getPct(dailyTotals.protein + dt.protein, dailyTargets.protein);
                      const carbFore = getPct(dailyTotals.carbs + dt.carbs, dailyTargets.carbs);
                      const fatFore = getPct(dailyTotals.fat + dt.fat, dailyTargets.fat);
                      const fibFore = getPct(dailyTotals.fiber + dt.fiber, dailyTargets.fiber);

                      const targetLineRight = (100 / MAX_SCALE_PERCENT) * 100;

                      const ProgressTrack = ({ color, currPct, forePct, label, icon }) => (
                        <div>
                          <div className="flex justify-between items-center text-[9px] font-bold mb-0.5">
                            <span className="text-slate-700 flex items-center gap-1">{label} {icon}</span>
                            <span>الحالي: {Math.round(currPct)}% <span className="text-slate-400 font-normal">(بالإضافة: {Math.round(forePct)}%)</span></span>
                          </div>
                          <div className="relative w-full h-2.5 bg-slate-100 rounded-full border border-slate-200/50">
                            {/* Forecast */}
                            <div className="absolute top-0 right-0 h-full bg-slate-300 transition-all" style={{ width: `${Math.min(100, (forePct/MAX_SCALE_PERCENT)*100)}%` }} />
                            {/* Current */}
                            <div className={`absolute top-0 right-0 h-full ${color} transition-all`} style={{ width: `${Math.min(100, (currPct/MAX_SCALE_PERCENT)*100)}%` }} />
                            {/* 100% Target Fix for RTL */}
                            <div className="absolute top-0 bottom-0 w-[2px] bg-slate-900 z-10" style={{ right: `${targetLineRight}%` }} />
                          </div>
                        </div>
                      );

                      return (
                        <div key={dish.id} className={`bg-white rounded-3xl p-4 shadow-sm transition-all border-2 ${currentQty > 0 ? 'border-emerald-500' : 'border-slate-200'}`}>
                          <div className="flex justify-between items-start mb-3 border-b border-slate-100 pb-2">
                            <div className="flex gap-2.5 items-center">
                              <span className="text-2xl bg-slate-50 p-2 rounded-2xl border border-slate-100">{dish.icon}</span>
                              <div>
                                <h3 className="font-black text-sm text-slate-800">{dish.name}</h3>
                                <span className="text-[10px] text-slate-400 font-bold">{dish.items.length} مكونات</span>
                              </div>
                            </div>
                            <div className="text-left text-[10px] font-black text-slate-500">
                              <span className="block text-amber-600">{dt.calories}🔥</span>
                              <span className="block text-rose-600">{dt.protein}g🍗</span>
                            </div>
                          </div>

                          <div className="space-y-2.5 pb-3">
                            <ProgressTrack color="bg-amber-400" currPct={calPct} forePct={calFore} label="السعرات" icon="🔥" />
                            <ProgressTrack color="bg-rose-400" currPct={proPct} forePct={proFore} label="البروتين" icon="🍗" />
                            <ProgressTrack color="bg-amber-500" currPct={carbPct} forePct={carbFore} label="الكارب" icon="🌾" />
                            <ProgressTrack color="bg-amber-700" currPct={fatPct} forePct={fatFore} label="الدهون" icon="🫒" />
                            <ProgressTrack color="bg-emerald-500" currPct={fibPct} forePct={fibFore} label="الألياف" icon="🥗" />
                          </div>

                          <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                            {currentQty > 0 ? (
                              <div className="flex items-center gap-3 bg-emerald-800 text-white rounded-xl px-2 py-1 shadow-sm">
                                <button onClick={() => handleUpdateLog(dish.id, 1)} className="p-1 hover:bg-emerald-600 rounded"><IconPlus /></button>
                                <span className="text-xs font-black">{currentQty}</span>
                                <button onClick={() => handleUpdateLog(dish.id, -1)} className="p-1 hover:bg-emerald-600 rounded"><IconMinus /></button>
                              </div>
                            ) : (
                              <button onClick={() => handleUpdateLog(dish.id, 1)} className="flex items-center gap-1 bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-emerald-700 shadow-sm">
                                <IconPlus /> إضافة للـ {activeMealTab}
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* TAB 2: RECIPES (أطباقي) */}
            {activeTab === 'recipes' && (
              <div className="space-y-4 animate-in fade-in">
                <div className="bg-white rounded-3xl p-4 shadow-sm border border-slate-200">
                  <div className="flex justify-between items-center mb-3">
                    <h2 className="font-black text-sm text-slate-800">أطباقي ووصفاتي</h2>
                    <div className="flex gap-2">
                      <button onClick={exportCSV} className="text-[10px] font-bold bg-slate-100 px-2 py-1 rounded-lg">تصدير CSV</button>
                      <button onClick={() => { setEditingDishId(null); setDishForm({name:'', icon:'🍲', items:[]}); setShowDishModal(true); }} className="text-[10px] font-bold bg-emerald-600 text-white px-2 py-1 rounded-lg">إنشاء طبق ➕</button>
                    </div>
                  </div>

                  <div className="space-y-2">
                    {dishes.map(d => {
                      const dt = getDishTotals(d.items);
                      return (
                        <div key={d.id} className="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex justify-between items-center">
                          <div className="flex gap-2 items-center">
                            <span className="text-xl">{d.icon}</span>
                            <div>
                              <h4 className="font-bold text-xs">{d.name}</h4>
                              <span className="text-[9px] text-slate-500 block">{dt.calories}c | {dt.protein}p | {dt.carbs}c | {dt.fat}f | {dt.fiber}fb</span>
                            </div>
                          </div>
                          <button onClick={() => { setEditingDishId(d.id); setDishForm({name:d.name, icon:d.icon, items:[...d.items]}); setShowDishModal(true); }} className="text-[10px] text-slate-500 bg-white px-2 py-1 rounded border">تعديل</button>
                        </div>
                      )
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: INGREDIENTS */}
            {activeTab === 'ingredients' && (
              <div className="bg-white rounded-3xl p-4 shadow-sm border border-slate-200">
                <h2 className="font-black text-sm mb-3">مكتبة المكونات الخام</h2>
                <div className="space-y-2 max-h-[60vh] overflow-y-auto">
                  {ingredients.map(ing => (
                    <div key={ing.id} className="bg-slate-50 p-2.5 rounded-xl border border-slate-200 flex justify-between items-center">
                      <div className="flex gap-2 items-center">
                        <span>{ing.icon}</span>
                        <div>
                          <span className="font-bold text-xs block">{ing.name}</span>
                          <span className="text-[9px] text-slate-500">لكل {ing.baseQty}{ing.unit}</span>
                        </div>
                      </div>
                      <div className="text-left text-[9px] font-bold text-slate-600">
                        <span className="block text-amber-600">{ing.calories} Cal</span>
                        <span className="block text-rose-600">{ing.protein} Pro</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </div>

          {/* BOTTOM NAVIGATION */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 shadow-[0_-5px_15px_-5px_rgba(0,0,0,0.1)] pb-safe">
            <div className="max-w-md mx-auto grid grid-cols-4 text-center p-2 text-[10px] font-bold text-slate-500">
              <button onClick={() => setActiveTab('vitals')} className={`p-2 flex flex-col items-center gap-1 rounded-xl transition-all ${activeTab==='vitals'?'bg-emerald-50 text-emerald-700':''}`}><span className="text-lg">📊</span>القياسات</button>
              <button onClick={() => setActiveTab('recipes')} className={`p-2 flex flex-col items-center gap-1 rounded-xl transition-all ${activeTab==='recipes'?'bg-emerald-50 text-emerald-700':''}`}><span className="text-lg">🍲</span>الأطباق</button>
              <button onClick={() => setActiveTab('ingredients')} className={`p-2 flex flex-col items-center gap-1 rounded-xl transition-all ${activeTab==='ingredients'?'bg-emerald-50 text-emerald-700':''}`}><span className="text-lg">🥦</span>المكونات</button>
              <button onClick={() => setActiveTab('meals')} className={`p-2 flex flex-col items-center gap-1 rounded-xl transition-all ${activeTab==='meals'?'bg-emerald-50 text-emerald-700':''}`}><span className="text-lg">🍽️</span>الوجبات</button>
            </div>
          </nav>

          {/* DISH CREATION MODAL */}
          {showDishModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
              <div className="bg-white w-full rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
                <h3 className="font-black text-sm mb-3">{editingDishId ? 'تعديل الطبق' : 'تكوين طبق جديد'}</h3>
                <input type="text" placeholder="اسم الطبق..." value={dishForm.name} onChange={e => setDishForm({...dishForm, name: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold mb-3" />
                
                <h4 className="text-[10px] font-bold text-slate-500 mb-1">اختر المكونات وحدد مضاعف الكمية:</h4>
                <div className="space-y-1.5 max-h-48 overflow-y-auto border p-2 rounded-xl bg-slate-50 mb-3">
                  {ingredients.map(ing => {
                    const sel = dishForm.items.find(i => i.ingredientId === ing.id);
                    return (
                      <div key={ing.id} className={`p-2 rounded-lg border flex justify-between items-center text-xs font-bold ${sel ? 'bg-emerald-50 border-emerald-300' : 'bg-white'}`}>
                        <button onClick={() => toggleIngInDish(ing.id)} className="flex gap-1.5 items-center flex-1"><span className="text-sm">{ing.icon}</span>{ing.name}</button>
                        {sel && (
                          <div className="flex gap-1 bg-white px-1 py-0.5 border rounded">
                            <button onClick={() => setDishForm(p => ({...p, items: p.items.map(it => it.ingredientId===ing.id ? {...it, qtyMultiplier: Math.max(0.1, it.qtyMultiplier-0.5)} : it)}))} className="px-1.5 bg-slate-100 rounded">-</button>
                            <span className="text-[10px] w-12 text-center">{Math.round(sel.qtyMultiplier * ing.baseQty)}{ing.unit}</span>
                            <button onClick={() => setDishForm(p => ({...p, items: p.items.map(it => it.ingredientId===ing.id ? {...it, qtyMultiplier: it.qtyMultiplier+0.5} : it)}))} className="px-1.5 bg-slate-100 rounded">+</button>
                          </div>
                        )}
                      </div>
                    )
                  })}
                </div>
                
                <div className="flex gap-2">
                  <button onClick={handleSaveDish} className="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs">حفظ الطبق</button>
                  <button onClick={() => setShowDishModal(false)} className="bg-slate-100 text-slate-700 font-bold px-4 rounded-xl text-xs">إلغاء</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
