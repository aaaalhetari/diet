    function App() {
      // Navigation state: 'meals' | 'ingredients' | 'recipes' | 'vitals'
      const [activeBottomTab, setActiveBottomTab] = useState('meals');
      const [activeMealIndex, setActiveMealIndex] = useState(0);

      // Goals & Vitals
      const [dailyGoals] = useState({ calories: 1500, protein: 150, carbs: 120, fiber: 25, fat: 45 });
      const [patientVitals, setPatientVitals] = useState({
        startWeight: 85,
        currentWeight: 81.2,
        targetWeight: 65,
        bpSystolic: 118,
        bpDiastolic: 78,
        heartRate: 72,
        waterGlasses: 6,
        waterTarget: 8
      });

      // Databases
      const [ingredients, setIngredients] = useState(INITIAL_INGREDIENTS);
      const [customDishes, setCustomDishes] = useState(INITIAL_CUSTOM_DISHES);
      const [selectedLoggedMeals, setSelectedLoggedMeals] = useState({ 'dish-biryani': 1, 'dish-toast-eggs': 1 });

      // Modal States
      const [showAddIngredientModal, setShowAddIngredientModal] = useState(false);
      const [showAddDishModal, setShowAddDishModal] = useState(false);
      const [detailModalItem, setDetailModalItem] = useState(null);

      // New Ingredient Form State
      const [newIng, setNewIng] = useState({
        name: '', unit: 'جرام', baseQty: 100, protein: 0, carbs: 0, fat: 0, fiber: 0, icon: '🥦'
      });

      // New Dish Form State
      const [newDish, setNewDish] = useState({
        name: '', category: 'غداء', icon: '🍲', selectedItems: []
      });

      // Swipe Refs
      const touchStartX = useRef(0);
      const touchEndX = useRef(0);

      // Auto-calculated calorie formula: Protein*4 + Carbs*4 + Fat*9
      const calculatedNewIngCalories = useMemo(() => {
        const p = parseFloat(newIng.protein) || 0;
        const c = parseFloat(newIng.carbs) || 0;
        const f = parseFloat(newIng.fat) || 0;
        return Math.round((p * 4) + (c * 4) + (f * 9));
      }, [newIng.protein, newIng.carbs, newIng.fat]);

      // Calculate totals for any dish
      const getDishTotals = (dishItems) => {
        let totals = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
        dishItems.forEach(item => {
          const ing = ingredients.find(i => i.id === item.ingredientId);
          if (ing) {
            const mult = item.qtyMultiplier || 1;
            totals.protein += ing.protein * mult;
            totals.carbs += ing.carbs * mult;
            totals.fat += ing.fat * mult;
            totals.fiber += ing.fiber * mult;
            totals.calories += ing.calories * mult;
          }
        });
        return {
          protein: Math.round(totals.protein * 10) / 10,
          carbs: Math.round(totals.carbs * 10) / 10,
          fat: Math.round(totals.fat * 10) / 10,
          fiber: Math.round(totals.fiber * 10) / 10,
          calories: Math.round(totals.calories)
        };
      };

      const currentTotals = useMemo(() => {
        let totals = { calories: 0, protein: 0, carbs: 0, fiber: 0, fat: 0 };
        Object.entries(selectedLoggedMeals).forEach(([dishId, qty]) => {
          const dish = customDishes.find(d => d.id === dishId);
          if (dish && qty > 0) {
            const dt = getDishTotals(dish.items);
            totals.calories += dt.calories * qty;
            totals.protein += dt.protein * qty;
            totals.carbs += dt.carbs * qty;
