    const { useState, useMemo, useRef, useEffect } = React;

    // --- Clean Inline SVG Icon Components ---
    const IconFlame = () => (<svg className="w-4 h-4 text-amber-500 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>);

    const INITIAL_INGREDIENTS = [
      { id: 'ing-1', name: 'صدر دجاج طازج', unit: 'جرام', baseQty: 100, protein: 31, carbs: 0, fat: 3.6, fiber: 0, calories: 165, icon: '🍗' },
      { id: 'ing-2', name: 'أرز بسمتي أبيض', unit: 'جرام', baseQty: 100, protein: 2.7, carbs: 28, fat: 0.3, fiber: 0.4, calories: 130, icon: '🍚' },
      { id: 'ing-3', name: 'زيت زيتون بكر', unit: 'ملعقة', baseQty: 10, protein: 0, carbs: 0, fat: 10, fiber: 0, calories: 88, icon: '🫒' },
      { id: 'ing-4', name: 'بيض كامل', unit: 'حبة', baseQty: 1, protein: 6, carbs: 0.5, fat: 5, fiber: 0, calories: 72, icon: '🥚' },
      { id: 'ing-5', name: 'بياض بيض', unit: 'حبة', baseQty: 1, protein: 3.6, carbs: 0.2, fat: 0.1, fiber: 0, calories: 17, icon: '🍳' },
      { id: 'ing-6', name: 'بطاطا حلوة مسلوقة', unit: 'جرام', baseQty: 100, protein: 1.6, carbs: 20, fat: 0.1, fiber: 3, calories: 86, icon: '🍠' },
      { id: 'ing-7', name: 'سلمون طازج', unit: 'جرام', baseQty: 100, protein: 20, carbs: 0, fat: 13, fiber: 0, calories: 206, icon: '🐟' },
      { id: 'ing-8', name: 'حليب بروتين بلدنا', unit: 'علبة', baseQty: 1, protein: 30, carbs: 16, fat: 2.2, fiber: 0, calories: 205, icon: '🥛' },
      { id: 'ing-9', name: 'زبادي يوناني بلدنا', unit: 'علبة', baseQty: 1, protein: 18, carbs: 6, fat: 1.5, fiber: 0, calories: 120, icon: '🥣' },
      { id: 'ing-10', name: 'سكوب آيسوليت بروتين', unit: 'سكوب', baseQty: 1, protein: 25, carbs: 1, fat: 0.5, fiber: 0, calories: 110, icon: '🥤' },
      { id: 'ing-11', name: 'شوفان كامل الحبة', unit: 'جرام', baseQty: 100, protein: 13, carbs: 67, fat: 7, fiber: 10, calories: 389, icon: '🌾' },
      { id: 'ing-12', name: 'خيار وطماطم طازجة', unit: 'جرام', baseQty: 100, protein: 0.8, carbs: 3.5, fat: 0.2, fiber: 1.2, calories: 18, icon: '🥗' },
      { id: 'ing-13', name: 'لحم بقر مفروم قليل الدسم', unit: 'جرام', baseQty: 100, protein: 26, carbs: 0, fat: 10, fiber: 0, calories: 194, icon: '🥩' },
      { id: 'ing-14', name: 'خبز توست أسمر', unit: 'شريحة', baseQty: 1, protein: 4, carbs: 12, fat: 1, fiber: 2, calories: 70, icon: '🍞' }
    ];

    const INITIAL_DISHES = [
      {
        id: 'dish-1',
        groupId: 'group-1',
        name: 'كبسة دجاج دايت مع أرز بسمتي',
        category: 'غداء',
        icon: '🍲',
        items: [
          { ingredientId: 'ing-1', qtyMultiplier: 1.5 }, // 150g chicken
          { ingredientId: 'ing-2', qtyMultiplier: 1.5 }, // 150g rice
          { ingredientId: 'ing-3', qtyMultiplier: 0.5 }  // 5ml olive oil
        ]
      },
      {
        id: 'dish-2',
        groupId: 'group-1',
        name: 'سندويش بيض مسلوق بالتوست الأسمر',
        category: 'فطور',
        icon: '🥪',
        items: [
          { ingredientId: 'ing-4', qtyMultiplier: 2 },   // 2 eggs
          { ingredientId: 'ing-14', qtyMultiplier: 2 }  // 2 toast slices
        ]
      },
      {
        id: 'dish-3',
        groupId: 'group-2',
        name: 'سلمون مشوي مع البطاطا الحلوة',
        category: 'عشاء',
        icon: '🍱',
        items: [
          { ingredientId: 'ing-7', qtyMultiplier: 1.5 }, // 150g salmon
          { ingredientId: 'ing-6', qtyMultiplier: 1.5 }, // 150g sweet potato
          { ingredientId: 'ing-12', qtyMultiplier: 1 }   // 100g salad
        ]
      },
      {
        id: 'dish-4',
        groupId: 'group-2',
        name: 'وجبة البروتين السريعة بلدنا',
        category: 'سناك',
        icon: '🥤',
        items: [
          { ingredientId: 'ing-8', qtyMultiplier: 1 },   // 1 protein milk
          { ingredientId: 'ing-9', qtyMultiplier: 1 }    // 1 greek yogurt
        ]
      },
      {
        id: 'dish-5',
        groupId: 'group-3',
        name: 'شوفان بالبروتين والزبادي اليوناني',
        category: 'فطور',
        icon: '🥣',
        items: [
          { ingredientId: 'ing-11', qtyMultiplier: 0.5 },// 50g oats
          { ingredientId: 'ing-10', qtyMultiplier: 1 },  // 1 scoop protein
          { ingredientId: 'ing-9', qtyMultiplier: 1 }    // 1 greek yogurt
        ]
      },
      {
        id: 'dish-6',
        groupId: 'group-3',
        name: 'ستيك لحم بقر مع أرز وسلطة',
        category: 'غداء',
        icon: '🥩',
        items: [
          { ingredientId: 'ing-13', qtyMultiplier: 1.8 },// 180g beef
          { ingredientId: 'ing-2', qtyMultiplier: 1.2 }, // 120g rice
          { ingredientId: 'ing-12', qtyMultiplier: 1 }   // 100g salad
        ]
      }
    ];

    const DISH_GROUPS = [
      { id: 'all', label: 'الكل 🍽️' },
      { id: 'group-1', label: 'المجموعة 1' },
      { id: 'group-2', label: 'المجموعة 2' },
      { id: 'group-3', label: 'المجموعة 3' },
      { id: 'group-4', label: 'المجموعة 4' },
      { id: 'group-5', label: 'المجموعة 5' },
      { id: 'group-6', label: 'المجموعة 6' }
    ];

    const MEAL_TYPES = [
      { id: 'فطور', label: 'فطور 🌅' },
      { id: 'غداء', label: 'غداء ☀️' },
      { id: 'عشاء', label: 'عشاء 🌙' },
      { id: 'سناك', label: 'سناك 🍎' }
    ];

    function App() {
      // Navigation State
      const [activeBottomTab, setActiveBottomTab] = useState('meals'); // 'meals' | 'ingredients' | 'recipes' | 'vitals'
      const [activeMealCategory, setActiveMealCategory] = useState('غداء');

      // Calorie Target State
      const [targetCalories, setTargetCalories] = useState(1500);

      // Meal Segments Allocations (percentages: split into 4 meals summing up to 100%)
      const [mealAllocations, setMealAllocations] = useState({
        'فطور': 25,
        'غداء': 35,
        'عشاء': 25,
        'سناك': 15
      });

      // Meal Sub-Macro Percentages (for each meal, P/C/F/Fib sum up to 100% of calorie energy split)
      const [mealMacroAllocations, setMealMacroAllocations] = useState({
        'فطور': { protein: 35, carbs: 40, fat: 15, fiber: 10 },
        'غداء': { protein: 40, carbs: 35, fat: 15, fiber: 10 },
        'عشاء': { protein: 45, carbs: 25, fat: 20, fiber: 10 },
        'سناك': { protein: 50, carbs: 30, fat: 10, fiber: 10 }
      });

      // Data States
      const [ingredients, setIngredients] = useState(INITIAL_INGREDIENTS);
      const [customDishes, setCustomDishes] = useState(INITIAL_DISHES);

      // Active Filter States in Meals Page
      const [activeGroupFilter, setActiveGroupFilter] = useState('all');
      const [openFilters, setOpenFilters] = useState({
        calories: 'الكل',
        protein: 'الكل',
        carbs: 'الكل',
        fat: 'الكل',
        fiber: 'الكل'
      });

      // Selected Dishes for Daily Meal Logging { dishId: quantity }
      const [selectedLoggedMeals, setSelectedLoggedMeals] = useState({
        'dish-1': 1,
        'dish-2': 1,
        'dish-4': 1
      });

      // Vitals State
      const [patientVitals, setPatientVitals] = useState({
        startWeight: 85,
        currentWeight: 81.2,
        targetWeight: 65,
        waterGlasses: 6,
        waterTarget: 8
      });

      // Modals
      const [showAddIngredientModal, setShowAddIngredientModal] = useState(false);
      const [showAddDishModal, setShowAddDishModal] = useState(false);
      const [editingIngId, setEditingIngId] = useState(null);
      const [editingDishId, setEditingDishId] = useState(null);
      const [detailModalItem, setDetailModalItem] = useState(null);

      // Forms State
      const [newIng, setNewIng] = useState({ name: '', unit: 'جرام', baseQty: 100, protein: 0, carbs: 0, fat: 0, fiber: 0, icon: '🥦' });
      const [newDish, setNewDish] = useState({ name: '', category: 'غداء', groupId: 'group-1', icon: '🍲', selectedItems: [] });

      const csvFileInputRef = useRef(null);

      // Calculate calories automatically for raw ingredient form
      const calculatedNewIngCalories = useMemo(() => {
        const p = parseFloat(newIng.protein) || 0;
        const c = parseFloat(newIng.carbs) || 0;
        const f = parseFloat(newIng.fat) || 0;
        return Math.round((p * 4) + (c * 4) + (f * 9));
      }, [newIng.protein, newIng.carbs, newIng.fat]);

      const handleExportCSV = () => {
        let csvContent = "\uFEFF"; // UTF-8 BOM for Arabic support
        csvContent += "# SECTION: INGREDIENTS\n";
        csvContent += "id,name,unit,baseQty,protein,carbs,fat,fiber,calories,icon\n";
        ingredients.forEach(ing => {
          const nameQuoted = `"${ing.name.replace(/"/g, '""')}"`;
          csvContent += `${ing.id},${nameQuoted},${ing.unit},${ing.baseQty},${ing.protein},${ing.carbs},${ing.fat},${ing.fiber},${ing.calories},${ing.icon}\n`;
        });

        csvContent += "\n# SECTION: DISHES\n";
        csvContent += "dishId,groupId,dishName,category,icon,ingredientId,qtyMultiplier\n";
        customDishes.forEach(dish => {
          const dishNameQuoted = `"${dish.name.replace(/"/g, '""')}"`;
          dish.items.forEach(item => {
            csvContent += `${dish.id},${dish.groupId || 'group-1'},${dishNameQuoted},${dish.category},${dish.icon || '🍲'},${item.ingredientId},${item.qtyMultiplier}\n`;
          });
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `nutrition_database_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleImportCSV = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const text = event.target.result;
            const lines = text.split(/\r?\n/);
            let currentSection = '';
            const importedIngredients = [];
            const dishMap = {};

            lines.forEach(line => {
              const trimmed = line.trim();
              if (!trimmed) return;
              if (trimmed.startsWith('# SECTION: INGREDIENTS')) { currentSection = 'INGREDIENTS'; return; }
              if (trimmed.startsWith('# SECTION: DISHES')) { currentSection = 'DISHES'; return; }

              const values = trimmed.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || trimmed.split(',');
              const cleanValues = values.map(v => v.replace(/^"|"$/g, '').replace(/""/g, '"').trim());

              if (currentSection === 'INGREDIENTS') {
                if (cleanValues[0] === 'id' || cleanValues.length < 10) return;
                importedIngredients.push({
                  id: cleanValues[0],
                  name: cleanValues[1],
                  unit: cleanValues[2],
                  baseQty: parseFloat(cleanValues[3]) || 100,
                  protein: parseFloat(cleanValues[4]) || 0,
                  carbs: parseFloat(cleanValues[5]) || 0,
                  fat: parseFloat(cleanValues[6]) || 0,
                  fiber: parseFloat(cleanValues[7]) || 0,
                  calories: parseFloat(cleanValues[8]) || 0,
                  icon: cleanValues[9] || '🥦'
                });
              } else if (currentSection === 'DISHES') {
                if (cleanValues[0] === 'dishId' || cleanValues.length < 7) return;
                const dishId = cleanValues[0];
                if (!dishMap[dishId]) {
                  dishMap[dishId] = {
                    id: dishId,
                    groupId: cleanValues[1] || 'group-1',
                    name: cleanValues[2],
                    category: cleanValues[3],
                    icon: cleanValues[4] || '🍲',
                    items: []
                  };
                }
                dishMap[dishId].items.push({ ingredientId: cleanValues[5], qtyMultiplier: parseFloat(cleanValues[6]) || 1 });
              }
            });

            if (importedIngredients.length > 0) setIngredients(importedIngredients);
            const importedDishes = Object.values(dishMap);
            if (importedDishes.length > 0) setCustomDishes(importedDishes);

            alert('تم استيراد قاعدة البيانات والمكونات بنجاح! 🎉');
          } catch (err) {
            alert('حدث خطأ في قراءة ملف CSV، يرجى التأكد من الصيغة.');
          }
          if (csvFileInputRef.current) csvFileInputRef.current.value = '';
        };
        reader.readAsText(file, 'UTF-8');
      };

      // Helper: Calculate Totals for a Dish
      const getDishTotals = (dishItems) => {
        let totals = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
        dishItems.forEach(item => {
          const ing = ingredients.find(i => i.id === item.ingredientId);
          if (ing) {
            const mult = item.qtyMultiplier || 1;
            totals.calories += Math.round(ing.calories * mult);
            totals.protein += Math.round((ing.protein * mult) * 10) / 10;
            totals.carbs += Math.round((ing.carbs * mult) * 10) / 10;
            totals.fat += Math.round((ing.fat * mult) * 10) / 10;
            totals.fiber += Math.round((ing.fiber * mult) * 10) / 10;
          }
        });
        return totals;
      };

      const currentLoggedTotals = useMemo(() => {
        let totals = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
        Object.entries(selectedLoggedMeals).forEach(([dishId, qty]) => {
          const dish = customDishes.find(d => d.id === dishId);
          if (dish && qty > 0) {
            const dt = getDishTotals(dish.items);
            totals.calories += dt.calories * qty;
            totals.protein += dt.protein * qty;
            totals.carbs += dt.carbs * qty;
            totals.fat += dt.fat * qty;
            totals.fiber += dt.fiber * qty;
          }
        });
        return totals;
      }, [selectedLoggedMeals, customDishes, ingredients]);

      // Calculate Target Nutrients per Meal
      const getMealTargetNutrients = (mealName) => {
        const mealCalPercent = mealAllocations[mealName] || 25;
        const mealCaloriesTarget = Math.round((targetCalories * mealCalPercent) / 100);
        const macros = mealMacroAllocations[mealName] || { protein: 40, carbs: 35, fat: 15, fiber: 10 };

        // Convert percentage of meal energy to grams
        const proteinGrams = Math.round(((mealCaloriesTarget * (macros.protein / 100)) / 4));
        const carbsGrams = Math.round(((mealCaloriesTarget * (macros.carbs / 100)) / 4));
        const fatGrams = Math.round(((mealCaloriesTarget * (macros.fat / 100)) / 9));
        const fiberGrams = Math.round(((mealCaloriesTarget * (macros.fiber / 100)) / 4));

        return {
          calories: mealCaloriesTarget,
          protein: proteinGrams,
          carbs: carbsGrams,
          fat: fatGrams,
          fiber: fiberGrams
        };
      };

      const filteredDishes = useMemo(() => {
        return customDishes.filter(dish => {
          // 1. Category Filter (فطور/غداء/عشاء/سناك)
          if (dish.category !== activeMealCategory) return false;

          // 2. Exclusive Group Filter
          if (activeGroupFilter !== 'all' && dish.groupId !== activeGroupFilter) return false;

          // 3. Open Multi-Nutrient Classification Filters
          const dt = getDishTotals(dish.items);
          
          const checkTier = (val, lowThreshold, highThreshold, setting) => {
            if (setting === 'الكل') return true;
            if (setting === 'منخفض' && val <= lowThreshold) return true;
            if (setting === 'متوسط' && val > lowThreshold && val < highThreshold) return true;
            if (setting === 'عالي' && val >= highThreshold) return true;
            return false;
          };

          const calOk = checkTier(dt.calories, 200, 450, openFilters.calories);
          const proOk = checkTier(dt.protein, 15, 35, openFilters.protein);
          const carbOk = checkTier(dt.carbs, 15, 40, openFilters.carbs);
          const fatOk = checkTier(dt.fat, 5, 15, openFilters.fat);
          const fibOk = checkTier(dt.fiber, 2, 6, openFilters.fiber);

          return calOk && proOk && carbOk && fatOk && fibOk;
        });
      }, [customDishes, activeMealCategory, activeGroupFilter, openFilters, ingredients]);

      // Logging quantity handlers
      const updateLoggedMealQty = (dishId, delta) => {
        setSelectedLoggedMeals(prev => {
          const current = prev[dishId] || 0;
          const next = Math.max(0, current + delta);
          const updated = { ...prev };
          if (next === 0) delete updated[dishId];
          else updated[dishId] = next;
          return updated;
        });
      };

      // Ingredient Save Handler
      const handleSaveIngredient = (e) => {
        e.preventDefault();
        if (!newIng.name) return;
        if (editingIngId) {
          setIngredients(prev => prev.map(ing => ing.id === editingIngId ? {
            ...ing,
            name: newIng.name,
            unit: newIng.unit,
            baseQty: parseFloat(newIng.baseQty) || 100,
            protein: parseFloat(newIng.protein) || 0,
            carbs: parseFloat(newIng.carbs) || 0,
            fat: parseFloat(newIng.fat) || 0,
            fiber: parseFloat(newIng.fiber) || 0,
            calories: calculatedNewIngCalories,
            icon: newIng.icon || '🥦'
          } : ing));
          setEditingIngId(null);
        } else {
          const item = {
            id: 'ing-' + Date.now(),
            name: newIng.name,
            unit: newIng.unit,
            baseQty: parseFloat(newIng.baseQty) || 100,
            protein: parseFloat(newIng.protein) || 0,
            carbs: parseFloat(newIng.carbs) || 0,
            fat: parseFloat(newIng.fat) || 0,

              <div className="space-y-4">
                <div className="bg-white rounded-3xl p-4 border border-slate-200 shadow-xs space-y-3">
                  <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                    <div>
                      <h2 className="font-black text-slate-900 text-sm">بطاقات الأطباق والوجبات ({customDishes.length} طبق)</h2>
                      <p className="text-[10px] text-slate-400">ابتكر وتعديل أطباقك المخصصة وتصديرها</p>
                    </div>

                    <div className="flex items-center gap-1.5">
                      <button
                        onClick={handleExportCSV}
                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-2.5 py-1.5 rounded-xl border border-slate-200"
                      >
                        📥 تصدير
                      </button>
                      <button
                        onClick={() => {
                          setEditingDishId(null);
                          setNewDish({ name: '', category: 'غداء', groupId: 'group-1', icon: '🍲', selectedItems: [] });
                          setShowAddDishModal(true);
                        }}
                        className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-xs"
                      >
                        <IconPlus /> <span>طبق جديد</span>
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 gap-3 pt-1 max-h-[65vh] overflow-y-auto no-scrollbar">
                    {customDishes.map(dish => {
                      const dt = getDishTotals(dish.items);
                      const grpObj = DISH_GROUPS.find(g => g.id === (dish.groupId || 'group-1')) || DISH_GROUPS[1];

                      return (
                        <div key={dish.id} className="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-3xl p-4 space-y-3 shadow-md">
                          <div className="flex items-center justify-between border-b border-slate-700/80 pb-2">
                            <div className="flex items-center gap-2">
                              <span className="text-2xl">{dish.icon}</span>
                              <div>
                                <h3 className="font-black text-sm">{dish.name}</h3>
                                <span className="text-[9px] text-emerald-400 font-bold block">{grpObj.label}</span>
                              </div>
                            </div>

                            <div className="flex items-center gap-2">
                              <span className="bg-emerald-500/20 text-emerald-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-500/30">
                                {dish.category}
                              </span>

                              <button
                                onClick={() => {
                                  setEditingDishId(dish.id);
                                  setNewDish({ name: dish.name, category: dish.category, groupId: dish.groupId || 'group-1', icon: dish.icon || '🍲', selectedItems: dish.items.map(it => ({ ...it })) });
                                  setShowAddDishModal(true);
                                }}
                                className="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 text-white text-[10px] font-bold rounded-lg border border-slate-600"
                              >
                                ✏️ تعديل
                              </button>
                              <button
                                onClick={() => setCustomDishes(prev => prev.filter(d => d.id !== dish.id))}
                                className="px-2 py-0.5 bg-rose-500/20 hover:bg-rose-500/40 text-rose-300 text-[10px] font-bold rounded-lg border border-rose-500/30"
                              >
                                🗑️ حذف
                              </button>
                            </div>
                          </div>

                          <div className="grid grid-cols-5 gap-1 text-center text-[9px] bg-slate-800/90 p-2 rounded-2xl border border-slate-700">
                            <div><span className="text-amber-400 block font-bold">السعرات</span><strong className="text-white text-xs">{dt.calories}</strong></div>
                            <div><span className="text-rose-400 block font-bold">البروتين</span><strong className="text-white text-xs">{dt.protein}غ</strong></div>
                            <div><span className="text-amber-300 block font-bold">الكارب</span><strong className="text-white text-xs">{dt.carbs}غ</strong></div>
                            <div><span className="text-emerald-400 block font-bold">الدهون</span><strong className="text-white text-xs">{dt.fat}غ</strong></div>
                            <div><span className="text-sky-300 block font-bold">الألياف</span><strong className="text-white text-xs">{dt.fiber}غ</strong></div>
                          </div>

                          <div className="text-[10px] text-slate-400 space-y-0.5 pt-1">
                            <span className="font-bold text-slate-300 block">المكونات الداخلة بالجرامات:</span>
                            {dish.items.map((it, idx) => {
                              const ing = ingredients.find(i => i.id === it.ingredientId);
                              return ing ? (
                                <span key={idx} className="inline-block bg-slate-700/60 px-2 py-0.5 rounded-md ml-1 mb-1">
                                  {ing.name} ({it.qtyMultiplier * ing.baseQty} {ing.unit})
                                </span>
                              ) : null;
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {}
            {activeBottomTab === 'vitals' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-3xl p-5 shadow-lg space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                    <h3 className="font-black text-sm">رحلة نزول الوزن والقياسات الحيوية</h3>
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2.5 py-0.5 rounded-full border border-emerald-500/30 font-bold">
                      خطة حازمة
                    </span>
                  </div>

                  <div className="space-y-2">
                    <div className="flex justify-between text-xs">
                      <span>الوزن الحالي: <strong className="text-white text-sm">{patientVitals.currentWeight} كجم</strong></span>
                      <span className="text-emerald-400 font-bold">الهدف: {patientVitals.targetWeight} كجم 🎯</span>
                    </div>

                    <div className="relative w-full h-3.5 bg-slate-700/80 rounded-full overflow-hidden p-0.5 border border-slate-600">
                      <div
                        className="h-full bg-gradient-to-r from-emerald-500 to-teal-400 rounded-full transition-all duration-500"
                        style={{
                          width: `${Math.min(
                            100,
                            ((patientVitals.startWeight - patientVitals.currentWeight) /
                              (patientVitals.startWeight - patientVitals.targetWeight)) *
                              100
                          )}%`
                        }}
                      />
                    </div>

                    <div className="flex justify-between text-[10px] text-slate-400">
                      <span>البداية: {patientVitals.startWeight} كجم</span>
                      <span>تم خسارة: {(patientVitals.startWeight - patientVitals.currentWeight).toFixed(1)} كجم 🎉</span>
                      <span>متبقي: {(patientVitals.currentWeight - patientVitals.targetWeight).toFixed(1)} كجم</span>
                    </div>
                  </div>
                </div>

                {/* Water Tracker */}
                <div className="bg-white rounded-3xl p-4 border border-slate-200 shadow-xs space-y-3">
                  <div className="flex items-center justify-between">
                    <h3 className="font-black text-slate-900 text-xs sm:text-sm">متابعة شرب الماء اليومي 💧</h3>
                    <span className="text-xs font-bold text-sky-600 bg-sky-50 px-2.5 py-0.5 rounded-full border border-sky-100">
                      {patientVitals.waterGlasses} / {patientVitals.waterTarget} أكواب
                    </span>
                  </div>

                  <div className="grid grid-cols-4 gap-2">
                    {Array.from({ length: patientVitals.waterTarget }).map((_, idx) => {
                      const isFilled = idx < patientVitals.waterGlasses;
                      return (
                        <button
                          key={idx}
                          onClick={() => setPatientVitals(prev => ({ ...prev, waterGlasses: Math.max(0, isFilled ? prev.waterGlasses - 1 : prev.waterGlasses + 1) }))}
                          className={`p-2 rounded-2xl border text-center transition-all ${
                            isFilled ? 'bg-sky-500 text-white border-sky-500 scale-102' : 'bg-slate-50 text-slate-300 border-slate-200'
                          }`}
                        >
                          <span className="text-base block">💧</span>
                          <span className="text-[9px] font-bold block mt-0.5">كوب {idx + 1}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

          </main>

          {}
          {/* ADD / EDIT INGREDIENT MODAL */}
          {showAddIngredientModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                  <h3 className="font-black text-slate-900 text-sm">
                    {editingIngId ? 'تعديل بيانات المكون الخام' : 'إضافة مكون خام جديد'}
                  </h3>
                  <button onClick={() => { setShowAddIngredientModal(false); setEditingIngId(null); }} className="text-slate-400 hover:text-slate-600 p-1">
                    <IconX />
                  </button>
                </div>
                <form onSubmit={handleSaveIngredient} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">اسم المكون</label>
                    <input type="text" required value={newIng.name} onChange={e => setNewIng({...newIng, name: e.target.value})} placeholder="مثال: صدر دجاج طازج" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">الكمية الأساسية</label>
                      <input type="number" required value={newIng.baseQty} onChange={e => setNewIng({...newIng, baseQty: e.target.value})} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">وحدة القياس</label>
                      <select value={newIng.unit} onChange={e => setNewIng({...newIng, unit: e.target.value})} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl">
                        <option value="جرام">جرام</option>
                        <option value="حبة">حبة</option>
                        <option value="ملعقة">ملعقة</option>
                        <option value="علبة">علبة</option>
                        <option value="سكوب">سكوب</option>
                        <option value="كوب">كوب</option>
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">البروتين (غ)</label>
                      <input type="number" step="0.1" value={newIng.protein} onChange={e => setNewIng({...newIng, protein: e.target.value})} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">الكارب (غ)</label>
                      <input type="number" step="0.1" value={newIng.carbs} onChange={e => setNewIng({...newIng, carbs: e.target.value})} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">الدهون (غ)</label>
                      <input type="number" step="0.1" value={newIng.fat} onChange={e => setNewIng({...newIng, fat: e.target.value})} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">الألياف (غ)</label>
                      <input type="number" step="0.1" value={newIng.fiber} onChange={e => setNewIng({...newIng, fiber: e.target.value})} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>
                  </div>
                  <div className="bg-emerald-50 p-2.5 rounded-xl border border-emerald-200 text-center">
                    <span className="text-emerald-800 font-bold block text-[11px]">السعرات المحسوبة آلياً:</span>
                    <span className="text-emerald-900 font-black text-sm">{calculatedNewIngCalories} سعرة</span>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 py-2 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700">
                      {editingIngId ? 'تحديث وتعديل المكون' : 'حفظ المكون'}
                    </button>
                    <button type="button" onClick={() => { setShowAddIngredientModal(false); setEditingIngId(null); }} className="py-2 px-4 bg-slate-100 text-slate-700 font-bold rounded-xl">إلغاء</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD / EDIT DISH MODAL */}
          {showAddDishModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                  <h3 className="font-black text-slate-900 text-sm">
                    {editingDishId ? 'تعديل بيانات الطبق' : 'ابتكار طبق جديد'}
                  </h3>
                  <button onClick={() => { setShowAddDishModal(false); setEditingDishId(null); }} className="text-slate-400 hover:text-slate-600 p-1">
                    <IconX />
                  </button>
                </div>
                <form onSubmit={handleSaveDish} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">اسم الطبق</label>
                    <input type="text" required value={newDish.name} onChange={e => setNewDish({...newDish, name: e.target.value})} placeholder="مثال: مجبوس دجاج دايت" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">الوجبة/الفئة</label>
                      <select value={newDish.category} onChange={e => setNewDish({...newDish, category: e.target.value})} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl">
                        <option value="فطور">فطور</option>
                        <option value="غداء">غداء</option>
                        <option value="عشاء">عشاء</option>
                        <option value="سناك">سناك</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">المجموعة التابعة</label>
                      <select value={newDish.groupId} onChange={e => setNewDish({...newDish, groupId: e.target.value})} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl font-bold">
                        {DISH_GROUPS.filter(g => g.id !== 'all').map(grp => (
                          <option key={grp.id} value={grp.id}>{grp.label}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">اختر المكونات والكميات للطبق:</label>
                    <div className="space-y-1.5 max-h-48 overflow-y-auto no-scrollbar border border-slate-200 rounded-xl p-2 bg-slate-50">
                      {ingredients.map(ing => {
                        const selected = newDish.selectedItems.find(i => i.ingredientId === ing.id);
                        return (
                          <div key={ing.id} className={`p-2 rounded-lg border transition-all flex items-center justify-between ${selected ? 'bg-emerald-50 border-emerald-300' : 'bg-white border-slate-200'}`}>
                            <button type="button" onClick={() => toggleIngredientInNewDish(ing.id)} className="flex items-center gap-1.5 text-right flex-1 font-bold text-[11px] text-slate-800">
                              <span className="text-sm">{ing.icon}</span>
                              <span>{ing.name}</span>
                            </button>
                            {selected && (
                              <div className="flex items-center gap-1 bg-white px-2 py-0.5 rounded border border-emerald-200">
                                <button type="button" onClick={() => updateNewDishItemMultiplier(ing.id, selected.qtyMultiplier - 0.2)} className="w-4 h-4 bg-slate-100 rounded font-bold flex items-center justify-center">-</button>
                                <span className="text-[10px] font-bold text-slate-700 w-12 text-center">{Math.round(selected.qtyMultiplier * ing.baseQty)} {ing.unit}</span>
                                <button type="button" onClick={() => updateNewDishItemMultiplier(ing.id, selected.qtyMultiplier + 0.2)} className="w-4 h-4 bg-slate-100 rounded font-bold flex items-center justify-center">+</button>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="submit" disabled={newDish.selectedItems.length === 0} className="flex-1 py-2 bg-emerald-600 disabled:bg-slate-300 text-white font-bold rounded-xl hover:bg-emerald-700">
                      {editingDishId ? 'تحديث وتعديل الطبق' : 'حفظ الطبق الجديد'}
                    </button>
                    <button type="button" onClick={() => { setShowAddDishModal(false); setEditingDishId(null); }} className="py-2 px-4 bg-slate-100 text-slate-700 font-bold rounded-xl">إلغاء</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-lg">
            <div className="max-w-md mx-auto grid grid-cols-4 gap-1 p-2 text-center text-xs">
              
              <button
                onClick={() => setActiveBottomTab('meals')}
                className={`py-2 rounded-2xl font-bold flex flex-col items-center justify-center gap-0.5 transition-all ${
                  activeBottomTab === 'meals' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-500 hover:text-slate-900'
                }`}
              >
                <span className="text-base">🍽️</span>
                <span className="text-[10px]">الوجبات</span>
              </button>

              <button
                onClick={() => setActiveBottomTab('ingredients')}
                className={`py-2 rounded-2xl font-bold flex flex-col items-center justify-center gap-0.5 transition-all ${
                  activeBottomTab === 'ingredients' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-500 hover:text-slate-900'
                }`}
              >
                <span className="text-base">🥦</span>
                <span className="text-[10px]">المكونات</span>
              </button>

              <button
                onClick={() => setActiveBottomTab('recipes')}
                className={`py-2 rounded-2xl font-bold flex flex-col items-center justify-center gap-0.5 transition-all ${
                  activeBottomTab === 'recipes' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-500 hover:text-slate-900'
                }`}
              >
                <span className="text-base">🍲</span>
                <span className="text-[10px]">الأطباق</span>
              </button>

              <button
                onClick={() => setActiveBottomTab('vitals')}
                className={`py-2 rounded-2xl font-bold flex flex-col items-center justify-center gap-0.5 transition-all ${
                  activeBottomTab === 'vitals' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-500 hover:text-slate-900'
                }`}
              >
                <span className="text-base">📊</span>
                <span className="text-[10px]">القياسات</span>
              </button>

            </div>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
