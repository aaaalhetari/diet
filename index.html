      { id: 'dish-protein-shake', name: 'سكوب آيسوليت مع لوز', category: 'سناك', icon: '🥤', items: [{ ingredientId: 'ing-whey-iso', qtyMultiplier: 1 }, { ingredientId: 'ing-almonds', qtyMultiplier: 1 }] }
    ];

    const MEAL_TABS = [
      { id: 'breakfast', title: 'فطور', icon: '🌅', color: 'amber' },
      { id: 'lunch', title: 'غداء', icon: '☀️', color: 'emerald' },
      { id: 'dinner', title: 'عشاء', icon: '🌙', color: 'indigo' },
      { id: 'snack', title: 'سناك', icon: '🍎', color: 'rose' }
    ];

    function App() {
      const [activeBottomTab, setActiveBottomTab] = useState('meals');
      const [activeMealIndex, setActiveMealIndex] = useState(0);

      const [dailyGoals] = useState({ calories: 1500, protein: 150, carbs: 120, fiber: 25, fat: 45 });
      const [patientVitals, setPatientVitals] = useState({
        startWeight: 85,
        currentWeight: 81.2,
        targetWeight: 65,
        bpSystolic: 118,
        bpDiastolic: 78,
        heartRate: 72,
        waterGlasses: 6,
        waterTarget: 8
      });

      // 1. MAIN BAR SEGMENT SPLIT PERCENTAGES (3 non-crossing handles: h0, h1, h2)
      // Representing boundaries for: [Breakfast, Lunch, Dinner, Snack]
      const [mealSplit, setMealSplit] = useState([30, 65, 85]); 

      // 2. PER-MEAL MACRO SEGMENT SPLIT PERCENTAGES (3 non-crossing handles for each meal)
      // Representing boundaries for: [Protein %, Carbs %, Fat %, Fiber %]
      const [mealMacroSplits, setMealMacroSplits] = useState({
        breakfast: [35, 70, 90], // 35% Pro, 35% Carb, 20% Fat, 10% Fiber
        lunch: [40, 75, 92],     // 40% Pro, 35% Carb, 17% Fat, 8% Fiber
        dinner: [35, 65, 88],    // 35% Pro, 30% Carb, 23% Fat, 12% Fiber
        snack: [30, 60, 85]      // 30% Pro, 30% Carb, 25% Fat, 15% Fiber
      });

      const [showPlannerModal, setShowPlannerModal] = useState(false);

      // Calculates Calorie Budget for each of the 4 meals based on Main Bar handles
      const mealCalBudgets = useMemo(() => {
        const bfk = Math.round((mealSplit[0] / 100) * dailyGoals.calories);
        const lun = Math.round(((mealSplit[1] - mealSplit[0]) / 100) * dailyGoals.calories);
        const din = Math.round(((mealSplit[2] - mealSplit[1]) / 100) * dailyGoals.calories);
        const snk = Math.round(((100 - mealSplit[2]) / 100) * dailyGoals.calories);
        return [bfk, lun, din, snk];
      }, [mealSplit, dailyGoals.calories]);

      // Calculates Exact Target Macro Grams for each meal from its Macro Bar split
      const mealMacroTargetsGrams = useMemo(() => {
        const result = {};
        MEAL_TABS.forEach((mTab, mIdx) => {
          const mKey = mTab.id;
          const calBudget = mealCalBudgets[mIdx];
          const split = mealMacroSplits[mKey] || [35, 70, 90];

          const pPct = split[0];
          const cPct = split[1] - split[0];
          const fPct = split[2] - split[1];
          const fibPct = 100 - split[2];

          // Calories to Grams conversion:
          result[mKey] = {
            protein: Math.round((calBudget * (pPct / 100)) / 4),
            carbs: Math.round((calBudget * (cPct / 100)) / 4),
            fat: Math.round((calBudget * (fPct / 100)) / 9),
            fiber: Math.round((calBudget * (fibPct / 100)) / 2)
          };
        });
        return result;
      }, [mealCalBudgets, mealMacroSplits]);

      // Direct Drag Handler Refs & Active State
      const mainBarRef = useRef(null);
      const mealBarRefs = useRef({});
      const [activeTooltip, setActiveTooltip] = useState(null); // { type, mealKey, handleIdx, val }

      const updateMainSplitHandle = (handleIdx, newPct) => {
        setMealSplit(prev => {
          const updated = [...prev];
          if (handleIdx === 0) {
            updated[0] = Math.max(5, Math.min(updated[1] - 5, newPct));
          } else if (handleIdx === 1) {
            updated[1] = Math.max(updated[0] + 5, Math.min(updated[2] - 5, newPct));
          } else if (handleIdx === 2) {
            updated[2] = Math.max(updated[1] + 5, Math.min(95, newPct));
          }
          return updated;
        });
      };

      const updateMealMacroSplitHandle = (mealKey, handleIdx, newPct) => {
        setMealMacroSplits(prev => {
          const currentSplit = prev[mealKey] || [35, 70, 90];
          const updated = [...currentSplit];
          if (handleIdx === 0) {
            updated[0] = Math.max(5, Math.min(updated[1] - 5, newPct));
          } else if (handleIdx === 1) {
            updated[1] = Math.max(updated[0] + 5, Math.min(updated[2] - 5, newPct));
          } else if (handleIdx === 2) {
            updated[2] = Math.max(updated[1] + 5, Math.min(95, newPct));
          }
          return { ...prev, [mealKey]: updated };
        });
      };

      const handlePointerDown = (e, type, handleIdx, mealKey = null) => {
        e.preventDefault();
        e.stopPropagation();
        const target = e.currentTarget;
        target.setPointerCapture(e.pointerId);

        let val = 0;
        if (type === 'main') val = mealSplit[handleIdx];
        else {
          const split = mealMacroSplits[mealKey] || [35, 70, 90];
          val = split[handleIdx];
        }

        setActiveTooltip({ type, mealKey, handleIdx, val });
      };

      const handlePointerMove = (e, type, handleIdx, mealKey = null) => {
        if (!e.currentTarget.hasPointerCapture(e.pointerId)) return;

        let targetBar = null;
        if (type === 'main') targetBar = mainBarRef.current;
        else if (type === 'meal' && mealKey) targetBar = mealBarRefs.current[mealKey];

        if (!targetBar) return;

        const rect = targetBar.getBoundingClientRect();
        const relativeX = rect.right - e.clientX;
        const newPct = Math.max(0, Math.min(100, Math.round((relativeX / rect.width) * 100)));

        if (type === 'main') {
          updateMainSplitHandle(handleIdx, newPct);
        } else if (type === 'meal' && mealKey) {
          updateMealMacroSplitHandle(mealKey, handleIdx, newPct);
        }

        setActiveTooltip(prev => prev ? { ...prev, val: newPct } : null);
      };

      const handlePointerUp = (e) => {
        if (e.currentTarget.hasPointerCapture(e.pointerId)) {
          e.currentTarget.releasePointerCapture(e.pointerId);
        }
        setActiveTooltip(null);
      };

      // Precision Stepper Helper Functions
      const stepMainSplit = (handleIdx, delta) => {
        updateMainSplitHandle(handleIdx, mealSplit[handleIdx] + delta);
      };

      const stepMealMacroSplit = (mealKey, handleIdx, delta) => {
        const split = mealMacroSplits[mealKey] || [35, 70, 90];

          {/* MODAL 3: ADD DISH MODAL */}
          {showAddDishModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                  <h3 className="font-black text-slate-900 text-sm">ابتكار طبق جديد</h3>
                  <button onClick={() => setShowAddDishModal(false)} className="text-slate-400 hover:text-slate-600 p-1">
                    <IconX />
                  </button>
                </div>
                <form onSubmit={handleSaveDish} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">اسم الطبق</label>
                    <input type="text" required value={newDish.name} onChange={e => setNewDish({...newDish, name: e.target.value})} placeholder="مثال: مجبوس دجاج دايت" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">الوجبة/الفئة</label>
                      <select value={newDish.category} onChange={e => setNewDish({...newDish, category: e.target.value})} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl">
                        <option value="فطور">فطور</option>
                        <option value="غداء">غداء</option>
                        <option value="عشاء">عشاء</option>
                        <option value="سناك">سناك</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">رمز الطبق (الأيقونة)</label>
                      <input type="text" value={newDish.icon} onChange={e => setNewDish({...newDish, icon: e.target.value})} placeholder="🍲" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-center" />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">اختر المكونات والكميات للطبق:</label>
                    <div className="space-y-1.5 max-h-48 overflow-y-auto no-scrollbar border border-slate-200 rounded-xl p-2 bg-slate-50">
                      {ingredients.map(ing => {
                        const selected = newDish.selectedItems.find(i => i.ingredientId === ing.id);
                        return (
                          <div key={ing.id} className={`p-2 rounded-lg border transition-all flex items-center justify-between ${selected ? 'bg-emerald-50 border-emerald-300' : 'bg-white border-slate-200'}`}>
                            <button type="button" onClick={() => toggleIngredientInNewDish(ing.id)} className="flex items-center gap-1.5 text-right flex-1 font-bold text-[11px] text-slate-800">
                              <span className="text-sm">{ing.icon}</span>
                              <span>{ing.name}</span>
                            </button>
                            {selected && (
                              <div className="flex items-center gap-1 bg-white px-2 py-0.5 rounded border border-emerald-200">
                                <button type="button" onClick={() => updateNewDishItemMultiplier(ing.id, selected.qtyMultiplier - 0.2)} className="w-4 h-4 bg-slate-100 rounded font-bold flex items-center justify-center">-</button>
                                <span className="text-[10px] font-bold text-slate-700 w-12 text-center">{Math.round(selected.qtyMultiplier * ing.baseQty)} {ing.unit}</span>
                                <button type="button" onClick={() => updateNewDishItemMultiplier(ing.id, selected.qtyMultiplier + 0.2)} className="w-4 h-4 bg-slate-100 rounded font-bold flex items-center justify-center">+</button>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="submit" disabled={newDish.selectedItems.length === 0} className="flex-1 py-2 bg-emerald-600 disabled:bg-slate-300 text-white font-bold rounded-xl hover:bg-emerald-700">حفظ الطبق الجديد</button>
                    <button type="button" onClick={() => setShowAddDishModal(false)} className="py-2 px-4 bg-slate-100 text-slate-700 font-bold rounded-xl">إلغاء</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
