<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق تتبع التغذية والأطباق المخصصة</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    // SVG Icon Helpers
    const IconFlame = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/></svg>;
    const IconDrumstick = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>;
    const IconWheat = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v18m0-18l-4 4m4-4l4 4m-4 5l-4 4m4-4l4 4m-4 5l-4 4m4-4l4 4"/></svg>;
    const IconSalad = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>;
    const IconDroplets = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/></svg>;
    const IconHeart = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>;
    const IconActivity = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>;
    const IconTreePine = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 2L4 12h3l-4 8h14l-4-8h3L12 2zM12 20v2"/></svg>;
    const IconUtensils = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>;
    const IconDatabase = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/></svg>;
    const IconChefHat = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4a4 4 0 013.83 2.83A4 4 0 0118 10a3 3 0 01-.17 1H6.17A3 3 0 016 10a4 4 0 012.17-3.17A4 4 0 0112 4zM6 14h12v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4z"/></svg>;
    const IconPlus = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4"/></svg>;
    const IconMinus = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M20 12H4"/></svg>;
    const IconCheck = () => <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"/></svg>;
    const IconInfo = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
    const IconX = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>;
    const IconTrash = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;

    const INITIAL_INGREDIENTS = [
      { id: 'ing-chicken', name: 'صدر دجاج خام', unit: 'جرام', baseQty: 100, protein: 31, carbs: 0, fat: 3.6, fiber: 0, calories: 165, icon: '🍗' },
      { id: 'ing-rice', name: 'أرز بسمتي مسلوق', unit: 'جرام', baseQty: 100, protein: 2.7, carbs: 28, fat: 0.3, fiber: 0.4, calories: 128, icon: '🍚' },
      { id: 'ing-olive-oil', name: 'زيت زيتون بكر', unit: 'ملعقة طعام (10 مل)', baseQty: 10, protein: 0, carbs: 0, fat: 10, fiber: 0, calories: 90, icon: '🫒' },
      { id: 'ing-egg', name: 'بيض مسلوق كامل', unit: 'حبة كبيرة', baseQty: 1, protein: 6.5, carbs: 0.6, fat: 5, fiber: 0, calories: 73, icon: '🥚' },
      { id: 'ing-toast', name: 'توست أسمر', unit: 'شريحة', baseQty: 1, protein: 4, carbs: 12, fat: 1, fiber: 2, calories: 73, icon: '🍞' },
      { id: 'ing-greek-yogurt', name: 'زبادي يوناني سادة', unit: 'علبة (170غ)', baseQty: 170, protein: 18, carbs: 6, fat: 1.5, fiber: 0, calories: 110, icon: '🥣' }
    ];

    const INITIAL_CUSTOM_DISHES = [
      {
        id: 'dish-biryani',
        name: 'طبق برياني دجاج صحي',
        category: 'غداء',
        icon: '🍲',
        items: [
          { ingredientId: 'ing-chicken', qtyMultiplier: 2 }, // 200g
          { ingredientId: 'ing-rice', qtyMultiplier: 1.5 },   // 150g
          { ingredientId: 'ing-olive-oil', qtyMultiplier: 0.5 } // 5ml
        ]
      },
      {
        id: 'dish-toast-eggs',
        name: 'سندويش بيض وتوست للدوام',
        category: 'فطور',
        icon: '🥪',
        items: [
          { ingredientId: 'ing-egg', qtyMultiplier: 2 },   // 2 بيضات
          { ingredientId: 'ing-toast', qtyMultiplier: 2 }  // 2 توست
        ]
      }
    ];

    const MEAL_TABS = [
      { id: 'breakfast', title: 'فطور', icon: '🌅' },
      { id: 'lunch', title: 'غداء', icon: '☀️' },
      { id: 'dinner', title: 'عشاء', icon: '🌙' },
      { id: 'snack', title: 'سناك', icon: '🍎' }
    ];

    function App() {
      // Navigation state: 'meals' | 'vitals' | 'tree' | 'ingredients' | 'recipes'
      const [activeBottomTab, setActiveBottomTab] = useState('meals');
      const [activeMealIndex, setActiveMealIndex] = useState(0);

      // Goals & Vitals
      const [dailyGoals] = useState({ calories: 1500, protein: 150, carbs: 120, fiber: 25, fat: 45 });
      const [patientVitals, setPatientVitals] = useState({
        startWeight: 85,
        currentWeight: 81.2,
        targetWeight: 65,
        bpSystolic: 118,
        bpDiastolic: 78,
        heartRate: 72,
        waterGlasses: 6,
        waterTarget: 8
      });

      // Databases
      const [ingredients, setIngredients] = useState(INITIAL_INGREDIENTS);
      const [customDishes, setCustomDishes] = useState(INITIAL_CUSTOM_DISHES);
      const [selectedLoggedMeals, setSelectedLoggedMeals] = useState({ 'dish-biryani': 1 });

      // Modal States
      const [showAddIngredientModal, setShowAddIngredientModal] = useState(false);
      const [showAddDishModal, setShowAddDishModal] = useState(false);
      const [detailModalItem, setDetailModalItem] = useState(null);

      // New Ingredient Form State
      const [newIng, setNewIng] = useState({
        name: '', unit: 'جرام', baseQty: 100, protein: 0, carbs: 0, fat: 0, fiber: 0, icon: '🥦'
      });

      // New Dish Form State
      const [newDish, setNewDish] = useState({
        name: '', category: 'غداء', icon: '🍲', selectedItems: [] // [{ ingredientId, qtyMultiplier }]
      });

      // Swipe Refs
      const touchStartX = useRef(0);
      const touchEndX = useRef(0);

      // Auto-calculated calorie formula: Protein*4 + Carbs*4 + Fat*9
      const calculatedNewIngCalories = useMemo(() => {
        const p = parseFloat(newIng.protein) || 0;
        const c = parseFloat(newIng.carbs) || 0;
        const f = parseFloat(newIng.fat) || 0;
        return Math.round((p * 4) + (c * 4) + (f * 9));
      }, [newIng.protein, newIng.carbs, newIng.fat]);

      // Calculate totals for any dish
      const getDishTotals = (dishItems) => {
        let totals = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
        dishItems.forEach(item => {
          const ing = ingredients.find(i => i.id === item.ingredientId);
          if (ing) {
            const mult = item.qtyMultiplier || 1;
            totals.protein += ing.protein * mult;
            totals.carbs += ing.carbs * mult;
            totals.fat += ing.fat * mult;
            totals.fiber += ing.fiber * mult;
            totals.calories += ing.calories * mult;
          }
        });
        return {
          protein: Math.round(totals.protein * 10) / 10,
          carbs: Math.round(totals.carbs * 10) / 10,
          fat: Math.round(totals.fat * 10) / 10,
          fiber: Math.round(totals.fiber * 10) / 10,
          calories: Math.round(totals.calories)
        };
      };

      const currentTotals = useMemo(() => {
        let totals = { calories: 0, protein: 0, carbs: 0, fiber: 0, fat: 0 };
        Object.entries(selectedLoggedMeals).forEach(([dishId, qty]) => {
          const dish = customDishes.find(d => d.id === dishId);
          if (dish && qty > 0) {
            const dt = getDishTotals(dish.items);
            totals.calories += dt.calories * qty;
            totals.protein += dt.protein * qty;
            totals.carbs += dt.carbs * qty;
            totals.fiber += dt.fiber * qty;
            totals.fat += dt.fat * qty;
          }
        });
        return totals;
      }, [selectedLoggedMeals, customDishes, ingredients]);

      const treeGrowthProgress = useMemo(() => {
        const calPct = Math.min(100, (currentTotals.calories / dailyGoals.calories) * 100);
        const proPct = Math.min(100, (currentTotals.protein / dailyGoals.protein) * 100);
        const waterPct = Math.min(100, (patientVitals.waterGlasses / patientVitals.waterTarget) * 100);
        return Math.round((calPct * 0.4) + (proPct * 0.4) + (waterPct * 0.2));
      }, [currentTotals, dailyGoals, patientVitals]);

      // Handlers
      const handleSaveIngredient = (e) => {
        e.preventDefault();
        if (!newIng.name) return;
        const item = {
          id: 'ing-' + Date.now(),
          name: newIng.name,
          unit: newIng.unit,
          baseQty: parseFloat(newIng.baseQty) || 100,
          protein: parseFloat(newIng.protein) || 0,
          carbs: parseFloat(newIng.carbs) || 0,
          fat: parseFloat(newIng.fat) || 0,
          fiber: parseFloat(newIng.fiber) || 0,
          calories: calculatedNewIngCalories,
          icon: newIng.icon || '🥦'
        };
        setIngredients(prev => [...prev, item]);
        setNewIng({ name: '', unit: 'جرام', baseQty: 100, protein: 0, carbs: 0, fat: 0, fiber: 0, icon: '🥦' });
        setShowAddIngredientModal(false);
      };

      const handleSaveDish = (e) => {
        e.preventDefault();
        if (!newDish.name || newDish.selectedItems.length === 0) return;
        const dish = {
          id: 'dish-' + Date.now(),
          name: newDish.name,
          category: newDish.category,
          icon: newDish.icon || '🍲',
          items: newDish.selectedItems
        };
        setCustomDishes(prev => [...prev, dish]);
        setNewDish({ name: '', category: 'غداء', icon: '🍲', selectedItems: [] });
        setShowAddDishModal(false);
      };

      const toggleIngredientInNewDish = (ingId) => {
        setNewDish(prev => {
          const exists = prev.selectedItems.find(i => i.ingredientId === ingId);
          if (exists) {
            return { ...prev, selectedItems: prev.selectedItems.filter(i => i.ingredientId !== ingId) };
          } else {
            return { ...prev, selectedItems: [...prev.selectedItems, { ingredientId: ingId, qtyMultiplier: 1 }] };
          }
        });
      };

      const updateNewDishItemMultiplier = (ingId, mult) => {
        setNewDish(prev => ({
          ...prev,
          selectedItems: prev.selectedItems.map(item => 
            item.ingredientId === ingId ? { ...item, qtyMultiplier: Math.max(0.1, mult) } : item
          )
        }));
      };

      const updateLogQty = (dishId, delta) => {
        setSelectedLoggedMeals(prev => {
          const current = prev[dishId] || 0;
          const updated = { ...prev };
          if (current + delta <= 0) delete updated[dishId];
          else updated[dishId] = current + delta;
          return updated;
        });
      };

      // Swipe Listeners
      const handleTouchStart = (e) => { touchStartX.current = e.targetTouches[0].clientX; };
      const handleTouchMove = (e) => { touchEndX.current = e.targetTouches[0].clientX; };
      const handleTouchEnd = () => {
        if (!touchStartX.current || !touchEndX.current) return;
        const dist = touchStartX.current - touchEndX.current;
        if (dist > 45 && activeMealIndex < MEAL_TABS.length - 1) setActiveMealIndex(prev => prev + 1);
        else if (dist < -45 && activeMealIndex > 0) setActiveMealIndex(prev => prev - 1);
        touchStartX.current = 0; touchEndX.current = 0;
      };

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 pb-28 selection:bg-emerald-500">
          
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs">
            <div className="max-w-md mx-auto px-4 py-2.5">
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-black shadow-xs">Q</div>
                  <div>
                    <h1 className="text-xs font-black text-slate-900 leading-none">متابعة التغذية والأطباق</h1>
                    <p className="text-[10px] text-slate-500 mt-0.5">خطة النزول (85 كجم ← 65 كجم)</p>
                  </div>
                </div>

                <div className="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">
                  هدف اليوم: 1,500 سعرة
                </div>
              </div>

              {/* Quick Macro Bar */}
              <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]">
                <div className="bg-amber-50 p-1.5 rounded-xl border border-amber-200/60">
                  <span className="text-amber-800 font-bold block">السعرات 🔥</span>
                  <span className="font-black text-slate-800">{currentTotals.calories}</span>
                  <span className="text-slate-400 block text-[9px]">/ {dailyGoals.calories}</span>
                </div>
                <div className="bg-rose-50 p-1.5 rounded-xl border border-rose-200/60">
                  <span className="text-rose-800 font-bold block">البروتين 🍗</span>
                  <span className="font-black text-slate-800">{currentTotals.protein}غ</span>
                  <span className="text-slate-400 block text-[9px]">/ {dailyGoals.protein}غ</span>
                </div>
                <div className="bg-amber-50/50 p-1.5 rounded-xl border border-amber-100">
                  <span className="text-amber-900 font-bold block">الكارب 🌾</span>
                  <span className="font-black text-slate-800">{currentTotals.carbs}غ</span>
                  <span className="text-slate-400 block text-[9px]">/ {dailyGoals.carbs}غ</span>
                </div>
                <div className="bg-emerald-50 p-1.5 rounded-xl border border-emerald-200/60">
                  <span className="text-emerald-800 font-bold block">الماء 💧</span>
                  <span className="font-black text-slate-800">{patientVitals.waterGlasses} ك</span>
                  <span className="text-slate-400 block text-[9px]">/ {patientVitals.waterTarget}</span>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-md mx-auto px-4 pt-3">


            {/* TAB 1: MEALS & LOGGING */}
            {activeBottomTab === 'meals' && (
              <div className="space-y-3">
                <div className="bg-white rounded-2xl p-1.5 shadow-xs border border-slate-200">
                  <div className="grid grid-cols-4 gap-1 text-center">
                    {MEAL_TABS.map((tab, idx) => (
                      <button
                        key={tab.id}
                        onClick={() => setActiveMealIndex(idx)}
                        className={`py-2 rounded-xl font-bold text-xs transition-all flex flex-col items-center gap-0.5 ${
                          activeMealIndex === idx ? 'bg-slate-900 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100'
                        }`}
                      >
                        <span className="text-sm">{tab.icon}</span>
                        <span>{tab.title}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} className="space-y-3 touch-pan-y min-h-[350px]">
                  <div className="p-2.5 rounded-2xl bg-white border border-slate-200 text-[11px] flex items-center justify-between">
                    <span className="font-bold text-slate-700">الأطباق المتاحة لوجبة ({MEAL_TABS[activeMealIndex].title})</span>
                    <span className="text-[10px] text-emerald-600 font-bold">👈 اسحب للتنقل بين الوجبات 👉</span>
                  </div>

                  {customDishes.map(dish => {
                    const totals = getDishTotals(dish.items);
                    const qty = selectedLoggedMeals[dish.id] || 0;
                    const isSelected = qty > 0;

                    return (
                      <div key={dish.id} className={`bg-white rounded-3xl p-4 border-2 transition-all shadow-xs ${isSelected ? 'border-emerald-500 ring-1 ring-emerald-500/20' : 'border-slate-200'}`}>
                        <div className="flex items-start justify-between mb-2">
                          <div className="flex items-center gap-2">
                            <span className="text-2xl p-2 bg-slate-50 rounded-2xl border border-slate-100">{dish.icon}</span>
                            <div>
                              <h3 className="font-black text-slate-900 text-sm">{dish.name}</h3>
                              <p className="text-[10px] text-slate-400 font-semibold">{dish.items.length} مكونات داخل الطبق</p>
                            </div>
                          </div>
                          {isSelected && (
                            <span className="bg-emerald-600 text-white text-[9px] font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1">
                              <IconCheck /> مسجل ({qty})
                            </span>
                          )}
                        </div>

                        {/* Dish Macro Breakdown */}
                        <div className="grid grid-cols-4 gap-1.5 bg-slate-50 p-2.5 rounded-2xl border border-slate-100 text-[10px] text-center my-2">
                          <div><span className="text-amber-700 font-bold block">السعرات</span><strong className="text-slate-800">{totals.calories}</strong></div>
                          <div><span className="text-rose-700 font-bold block">البروتين</span><strong className="text-slate-800">{totals.protein}غ</strong></div>
                          <div><span className="text-amber-900 font-bold block">الكارب</span><strong className="text-slate-800">{totals.carbs}غ</strong></div>
                          <div><span className="text-emerald-700 font-bold block">الدهون</span><strong className="text-slate-800">{totals.fat}غ</strong></div>
                        </div>

                        <div className="flex items-center justify-between pt-1 border-t border-slate-100">
                          {isSelected ? (
                            <div className="flex items-center bg-emerald-800 text-white rounded-xl px-2 py-1 text-xs font-bold gap-2">
                              <button onClick={() => updateLogQty(dish.id, 1)} className="w-5 h-5 bg-emerald-700 rounded flex items-center justify-center">+</button>
                              <span className="w-4 text-center">{qty}</span>
                              <button onClick={() => updateLogQty(dish.id, -1)} className="w-5 h-5 bg-emerald-700 rounded flex items-center justify-center">-</button>
                            </div>
                          ) : (
                            <button onClick={() => updateLogQty(dish.id, 1)} className="flex items-center gap-1 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold px-3 py-1.5 rounded-xl">
                              <IconPlus /> <span>إضافة للوجبة</span>
                            </button>
                          )}

                          <button onClick={() => setDetailModalItem(dish)} className="text-[11px] text-slate-500 font-semibold flex items-center gap-1">
                            <span>مكونات الطبق</span> <IconInfo />
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 2: INGREDIENTS MANAGER (مدخلات المكونات) */}
            {activeBottomTab === 'ingredients' && (
              <div className="space-y-4">
                <div className="bg-white rounded-3xl p-4 border border-slate-200 shadow-xs space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="font-black text-slate-900 text-sm">مكتبة مدخلات الأطعمة الخام</h2>
                      <p className="text-[10px] text-slate-400">سجل قيم المكونات وحساب السعرات التلقائي</p>
                    </div>
                    <button
                      onClick={() => setShowAddIngredientModal(true)}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1 shadow-xs"
                    >
                      <IconPlus /> <span>إضافة مكون جديد</span>
                    </button>
                  </div>

                  <div className="space-y-2.5 pt-2">
                    {ingredients.map(ing => (
                      <div key={ing.id} className="bg-slate-50 rounded-2xl p-3 border border-slate-200/80 flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                          <span className="text-2xl p-1.5 bg-white rounded-xl border border-slate-200">{ing.icon}</span>
                          <div>
                            <h3 className="font-black text-xs text-slate-800">{ing.name}</h3>
                            <p className="text-[10px] text-slate-400">الوحدة: {ing.baseQty} {ing.unit}</p>
                          </div>
                        </div>

                        <div className="text-left">
                          <span className="font-black text-amber-600 text-xs block">{ing.calories} سعرة</span>
                          <span className="text-[9px] text-slate-500 font-bold block">
                            بروتين: {ing.protein}غ | كارب: {ing.carbs}غ | دهون: {ing.fat}غ
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: DISH / RECIPE BUILDER (منشئ الأطباق) */}
            {activeBottomTab === 'recipes' && (
              <div className="space-y-4">
                <div className="bg-white rounded-3xl p-4 border border-slate-200 shadow-xs space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="font-black text-slate-900 text-sm">بطاقات الأطباق والوجبات المرتبة</h2>
                      <p className="text-[10px] text-slate-400">اصنع أطباقك من المكونات المتاحة</p>
                    </div>
                    <button
                      onClick={() => setShowAddDishModal(true)}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1 shadow-xs"
                    >
                      <IconPlus /> <span>ابتكار طبق جديد</span>
                    </button>
                  </div>

                  <div className="grid grid-cols-1 gap-3 pt-2">
                    {customDishes.map(dish => {
                      const dt = getDishTotals(dish.items);
                      return (
                        <div key={dish.id} className="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-3xl p-4 space-y-3 shadow-md">
                          <div className="flex items-center justify-between border-b border-slate-700/80 pb-2">
                            <div className="flex items-center gap-2">
                              <span className="text-2xl">{dish.icon}</span>
                              <h3 className="font-black text-sm">{dish.name}</h3>
                            </div>
                            <span className="bg-emerald-500/20 text-emerald-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-500/30">
                              {dish.category}
                            </span>
                          </div>

                          <div className="grid grid-cols-4 gap-1 text-center text-[10px] bg-slate-800/90 p-2 rounded-2xl border border-slate-700">
                            <div><span className="text-amber-400 block font-bold">السعرات</span><strong className="text-white text-xs">{dt.calories}</strong></div>
                            <div><span className="text-rose-400 block font-bold">البروتين</span><strong className="text-white text-xs">{dt.protein}غ</strong></div>
                            <div><span className="text-amber-300 block font-bold">الكارب</span><strong className="text-white text-xs">{dt.carbs}غ</strong></div>
                            <div><span className="text-emerald-400 block font-bold">الدهون</span><strong className="text-white text-xs">{dt.fat}غ</strong></div>
                          </div>

                          <div className="text-[10px] text-slate-400 space-y-0.5 pt-1">
                            <span className="font-bold text-slate-300 block">المكونات الداخلة بالجرامات:</span>
                            {dish.items.map((it, idx) => {
                              const ing = ingredients.find(i => i.id === it.ingredientId);
                              return ing ? (
                                <span key={idx} className="inline-block bg-slate-700/60 px-2 py-0.5 rounded-md ml-1 mb-1">
                                  {ing.name} ({it.qtyMultiplier * ing.baseQty} {ing.unit})
                                </span>
                              ) : null;
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: VITALS */}
            {activeBottomTab === 'vitals' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-3xl p-5 shadow-lg space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-700/80 pb-3">
                    <span className="font-bold text-sm">ملف المريض والهدف</span>
                    <span className="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-2.5 py-0.5 rounded-full">85 كجم ← 65 كجم</span>
                  </div>
                  <div className="space-y-2">
                    <div className="flex justify-between items-baseline text-xs">
                      <span className="text-slate-400">الوزن الحالي: <strong className="text-white text-sm">{patientVitals.currentWeight} كجم</strong></span>
                      <span className="text-emerald-400 font-bold">الهدف: {patientVitals.targetWeight} كجم 🎯</span>
                    </div>
                    <div className="w-full h-3.5 bg-slate-700/80 rounded-full overflow-hidden p-0.5">
                      <div className="h-full bg-emerald-500 rounded-full" style={{ width: `${((85 - patientVitals.currentWeight) / 20) * 100}%` }} />
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: TREE */}
            {activeBottomTab === 'tree' && (
              <div className="bg-white rounded-3xl p-6 shadow-xs border border-slate-200 text-center space-y-4">
                <h2 className="font-black text-slate-900 text-sm">شجرة النمو والإنجاز</h2>
                <div className="w-40 h-40 mx-auto bg-emerald-50 rounded-full flex items-center justify-center border-4 border-emerald-100 text-6xl">
                  {treeGrowthProgress < 30 ? '🌱' : treeGrowthProgress < 70 ? '🪴' : '🌳'}
                </div>
                <p className="text-xs text-slate-500">نسبة النمو اليومية: <strong className="text-emerald-600">{treeGrowthProgress}%</strong></p>
              </div>
            )}

          </main>

          {/* BOTTOM HOME BAR */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-lg">
            <div className="max-w-md mx-auto grid grid-cols-5 gap-1 p-2 text-center text-xs">
              
              <button onClick={() => setActiveBottomTab('meals')} className={`py-1.5 rounded-2xl font-bold flex flex-col items-center justify-center transition-all ${activeBottomTab === 'meals' ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>
                <IconUtensils /><span className="text-[10px] mt-0.5">الوجبات</span>
              </button>

              <button onClick={() => setActiveBottomTab('ingredients')} className={`py-1.5 rounded-2xl font-bold flex flex-col items-center justify-center transition-all ${activeBottomTab === 'ingredients' ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>
                <IconDatabase /><span className="text-[10px] mt-0.5">المكونات</span>
              </button>

              <button onClick={() => setActiveBottomTab('recipes')} className={`py-1.5 rounded-2xl font-bold flex flex-col items-center justify-center transition-all ${activeBottomTab === 'recipes' ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>
                <IconChefHat /><span className="text-[10px] mt-0.5">الأطباق</span>
              </button>

              <button onClick={() => setActiveBottomTab('tree')} className={`py-1.5 rounded-2xl font-bold flex flex-col items-center justify-center transition-all ${activeBottomTab === 'tree' ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>
                <IconTreePine /><span className="text-[10px] mt-0.5">الشجرة</span>
              </button>

              <button onClick={() => setActiveBottomTab('vitals')} className={`py-1.5 rounded-2xl font-bold flex flex-col items-center justify-center transition-all ${activeBottomTab === 'vitals' ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>
                <IconActivity /><span className="text-[10px] mt-0.5">القياسات</span>
              </button>

            </div>
          </nav>

          {/* MODAL 1: ADD NEW INGREDIENT */}
          {showAddIngredientModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">إدخال مكون طعام جديد</h3>
                  <button onClick={() => setShowAddIngredientModal(false)} className="text-slate-400"><IconX /></button>
                </div>

                <form onSubmit={handleSaveIngredient} className="space-y-2 text-xs">
                  <div>
                    <label className="block text-slate-600 font-bold mb-1">اسم المكون:</label>
                    <input type="text" value={newIng.name} onChange={e => setNewIng({ ...newIng, name: e.target.value })} placeholder="مثلاً: لحم بقر مفروم" required className="w-full p-2 border rounded-xl" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-600 font-bold mb-1">وحدة القياس:</label>
                      <input type="text" value={newIng.unit} onChange={e => setNewIng({ ...newIng, unit: e.target.value })} placeholder="جرام / حبة / سكوب" className="w-full p-2 border rounded-xl" />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-bold mb-1">الكمية لكل وحدة:</label>
                      <input type="number" value={newIng.baseQty} onChange={e => setNewIng({ ...newIng, baseQty: e.target.value })} className="w-full p-2 border rounded-xl" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <div>
                      <label className="block text-slate-600 font-bold mb-1">البروتين (غ):</label>
                      <input type="number" step="0.1" value={newIng.protein} onChange={e => setNewIng({ ...newIng, protein: e.target.value })} className="w-full p-2 border rounded-xl bg-rose-50" />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-bold mb-1">الكربوهيدرات (غ):</label>
                      <input type="number" step="0.1" value={newIng.carbs} onChange={e => setNewIng({ ...newIng, carbs: e.target.value })} className="w-full p-2 border rounded-xl bg-amber-50" />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-bold mb-1">الدهون (غ):</label>
                      <input type="number" step="0.1" value={newIng.fat} onChange={e => setNewIng({ ...newIng, fat: e.target.value })} className="w-full p-2 border rounded-xl bg-slate-50" />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-bold mb-1">الألياف (غ):</label>
                      <input type="number" step="0.1" value={newIng.fiber} onChange={e => setNewIng({ ...newIng, fiber: e.target.value })} className="w-full p-2 border rounded-xl bg-emerald-50" />
                    </div>
                  </div>

                  {/* Auto Calculated Calorie Display */}
                  <div className="p-3 bg-amber-500/10 border border-amber-300 rounded-2xl text-center">
                    <span className="text-[10px] text-amber-900 font-bold block">السعرات الحرارية المحسوبة أوتوماتيكياً:</span>
                    <strong className="text-amber-700 text-lg font-black">{calculatedNewIngCalories} سعرة</strong>
                  </div>

                  <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl shadow-xs mt-2">
                    حفظ المكون في القائمة
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 2: CREATE CUSTOM DISH */}
          {showAddDishModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto no-scrollbar">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">منشئ الأطباق (مثال: برياني)</h3>
                  <button onClick={() => setShowAddDishModal(false)} className="text-slate-400"><IconX /></button>
                </div>

                <form onSubmit={handleSaveDish} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-600 font-bold mb-1">اسم الطبق:</label>
                    <input type="text" value={newDish.name} onChange={e => setNewDish({ ...newDish, name: e.target.value })} placeholder="مثلاً: طبق برياني دجاج خفيف" required className="w-full p-2 border rounded-xl" />
                  </div>

                  <div>
                    <label className="block text-slate-600 font-bold mb-1">اختر المكونات والكمية المطلوبة:</label>
                    <div className="space-y-1.5 max-h-48 overflow-y-auto border p-2 rounded-2xl bg-slate-50">
                      {ingredients.map(ing => {
                        const selectedItem = newDish.selectedItems.find(i => i.ingredientId === ing.id);
                        const isChecked = !!selectedItem;

                        return (
                          <div key={ing.id} className="p-2 bg-white rounded-xl border flex items-center justify-between">
                            <label className="flex items-center gap-2 cursor-pointer">
                              <input type="checkbox" checked={isChecked} onChange={() => toggleIngredientInNewDish(ing.id)} className="accent-emerald-600" />
                              <span className="font-bold text-slate-800">{ing.icon} {ing.name}</span>
                            </label>

                            {isChecked && (
                              <div className="flex items-center gap-1">
                                <input
                                  type="number"
                                  step="0.1"
                                  value={selectedItem.qtyMultiplier}
                                  onChange={e => updateNewDishItemMultiplier(ing.id, parseFloat(e.target.value))}
                                  className="w-12 p-1 border text-center rounded-lg text-xs"
                                />
                                <span className="text-[9px] text-slate-400">× {ing.baseQty} {ing.unit}</span>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Calculated Dish Card Preview */}
                  {newDish.selectedItems.length > 0 && (
                    <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-2xl space-y-1">
                      <span className="text-[10px] font-bold text-emerald-800 block">معاينة القيم الكلية للطبق:</span>
                      {(() => {
                        const dt = getDishTotals(newDish.selectedItems);
                        return (
                          <div className="grid grid-cols-4 gap-1 text-center text-[9px] font-bold">
                            <span className="bg-white p-1 rounded text-amber-700">{dt.calories} سعرة</span>
                            <span className="bg-white p-1 rounded text-rose-700">{dt.protein}غ بروتين</span>
                            <span className="bg-white p-1 rounded text-amber-900">{dt.carbs}غ كارب</span>
                            <span className="bg-white p-1 rounded text-emerald-700">{dt.fat}غ دهون</span>
                          </div>
                        );
                      })()}
                    </div>
                  )}

                  <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl shadow-xs">
                    حفظ الطبق في البطاقات
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* DETAIL MODAL */}
          {detailModalItem && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-xs rounded-3xl p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">{detailModalItem.name}</h3>
                  <button onClick={() => setDetailModalItem(null)} className="text-slate-400"><IconX /></button>
                </div>

                <div className="space-y-1 text-xs text-slate-600">
                  <span className="font-bold block text-slate-800 mb-1">المكونات الداخلة في التركيب:</span>
                  {detailModalItem.items.map((it, idx) => {
                    const ing = ingredients.find(i => i.id === it.ingredientId);
                    return ing ? (
                      <div key={idx} className="flex justify-between py-1 border-b border-slate-100">
                        <span>{ing.icon} {ing.name}</span>
                        <strong className="text-slate-800">{it.qtyMultiplier * ing.baseQty} {ing.unit}</strong>
                      </div>
                    ) : null;
                  })}
                </div>

                <button onClick={() => setDetailModalItem(null)} className="w-full py-2 bg-slate-900 text-white font-bold text-xs rounded-xl">
                  إغلاق
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
